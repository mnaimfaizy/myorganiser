<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone mobile numbers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
    <a href="#" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>More</a>
    <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B21B6; font: 700 17px 'Inter', sans-serif">Add</button>
  </div>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Illustration" kind="mobile" size="44" hint-size="44px,44px"></dc-import>
      <span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em">Mobile numbers</h1><span style="font-size: 13px; line-height: 18px; color: #64748B">4 saved · 1 place to update</span></span>
    </div>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{items}}" as="m" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 4px; min-height: 72px; padding: 0 6px 0 16px; border-bottom: 1px solid #F1F5F9">
          <a href="{{m.href}}" style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; text-decoration: none; color: #0F172A; padding: 10px 0">
            <span style="font-size: 17px; line-height: 24px; font-weight: 600">{{m.label}}</span>
            <span style="font-size: 15px; line-height: 20px; color: #334155; font-variant-numeric: tabular-nums">{{m.number}}</span>
          </a>
          <button type="button" aria-label="Copy {{m.label}} number" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="5" y="5" width="10" height="11" rx="2" fill="#334155"></rect><rect x="2" y="2" width="10" height="11" rx="2" fill="#94A3B8"></rect></svg></button>
          <a href="#" aria-label="Call {{m.label}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2 L8 2 L9.5 6 L7.5 7.5 C8.5 9.8 10.2 11.5 12.5 12.5 L14 10.5 L18 12 V15 Q18 18 15 18 C8.4 18 2 11.6 2 5 Q2 2 5 2 Z" fill="#5B21B6"></path></svg></a>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { label: 'Personal', number: '+61 412 345 678', href: 'MobileDetailPhone.dc.html' },
        { label: 'Work', number: '+61 498 765 432', href: '#' },
        { label: 'Old prepaid', number: '+61 433 222 111', href: '#' },
        { label: 'UK roaming', number: '+44 7700 900 123', href: '#' }
      ]
    };
  }
}
</script>
</body>
</html>
