<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page header bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="box-sizing: border-box; width: 100%; min-height: 76px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 32px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <button type="button" aria-label="Collapse sidebar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3 H17 Q18 3 18 4 V16 Q18 17 17 17 H3 Q2 17 2 16 V4 Q2 3 3 3 Z M4 5 V15 H7 V5 Z M9 5 V15 H16 V5 Z" fill="#334155"></path></svg></button>
  <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
    <nav aria-label="Breadcrumb" style="font-size: 13px; line-height: 18px; color: #64748B">{{crumb}}</nav>
    <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.015em">{{title}}</span>
  </span>
  <sc-if value="{{synced}}" hint-placeholder-val="{{true}}">
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: #CCFBF1; color: #115E59; font-size: 13px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #0F766E"></span>Synced · 2 min ago</span>
  </sc-if>
  <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 13px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #B45309"></span>Vault locked</span>
  </sc-if>
  <sc-if value="{{admin}}" hint-placeholder-val="{{false}}">
    <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: #EDE9FE; color: #5B21B6; font-size: 13px; font-weight: 600">Platform admin</span>
  </sc-if>
  <button type="button" aria-haspopup="menu" aria-expanded="false" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px 0 6px; border-radius: 14px; border: 1px solid #E2E8F0; background: #F8FAFC; font-family: 'Inter', sans-serif">
    <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #7C3AED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 13px 'Plus Jakarta Sans', sans-serif">SM</span>
    <span style="display: flex; flex-direction: column; text-align: left"><span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #0F172A">Sam Miller</span><span style="font-size: 12px; line-height: 16px; color: #64748B">sam@example.com</span></span>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 4.5 L7 10 L12.5 4.5 L11.1 3.1 L7 7.2 L2.9 3.1 Z" fill="#334155"></path></svg>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Home"},"crumb":{"editor":"text","default":"Dashboard"},"state":{"editor":"enum","options":["synced","locked","admin"],"default":"synced"},"$preview":{"width":1168,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'synced';
    return {
      title: this.props.title ?? 'Home',
      crumb: this.props.crumb ?? 'Dashboard',
      synced: s === 'synced',
      locked: s === 'locked',
      admin: s === 'admin'
    };
  }
}
</script>
</body>
</html>
