<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add task dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input::placeholder,textarea::placeholder{color:#64748B}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.4)"></div>
  <form role="dialog" aria-labelledby="ta-t" style="position: absolute; left: 50%; top: 72px; transform: translateX(-50%); width: 560px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 24px; background: #FFFFFF; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2)">
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 24px 24px 16px; border-bottom: 1px solid #E2E8F0">
      <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
        <h2 id="ta-t" style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700">Add task</h2>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #115E59"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #0F766E"></span>Encrypted on this device before it syncs</span>
      </span>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="1" width="2.2" height="16" rx="1.1" fill="#334155" transform="rotate(45 9 9)"></rect><rect x="8" y="1" width="2.2" height="16" rx="1.1" fill="#334155" transform="rotate(-45 9 9)"></rect></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 24px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ta-n" style="font-size: 15px; font-weight: 600">Title</label>
        <div style="display: flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 12px 0 13px; border-radius: 12px; border: 2px solid #DC2626"><input id="ta-n" aria-invalid="true" aria-describedby="ta-ne" placeholder="What needs doing?" style="flex-grow: 1; min-width: 0; border: 0; outline: none; font: 400 16px 'Inter', sans-serif"></div>
        <span id="ta-ne" style="font-size: 13px; color: #B91C1C">Give the task a title.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="ta-d" style="font-size: 15px; font-weight: 600">Description <span style="font-weight: 400; color: #64748B">· optional</span></label><textarea id="ta-d" rows="3" placeholder="Details, links, who to ask" style="box-sizing: border-box; padding: 10px 14px; border-radius: 12px; border: 1px solid #64748B; font: 400 16px 'Inter', sans-serif; resize: vertical; outline: none"></textarea></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Priority</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #ECEEF0"><button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">High</button><button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 14px 'Inter', sans-serif">Medium</button><button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">Low</button></div></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Context</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #ECEEF0"><button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 14px 'Inter', sans-serif">None</button><button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">Personal</button><button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">Work</button></div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="ta-s" style="font-size: 15px; font-weight: 600">Status</label><button id="ta-s" type="button" aria-haspopup="listbox" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #64748B; background: #FFFFFF; font: 400 15px 'Inter', sans-serif; color: #0F172A">Pending<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 4.5 L7 10 L12.5 4.5 L11.1 3.1 L7 7.2 L2.9 3.1 Z" fill="#334155"></path></svg></button></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="ta-due" style="font-size: 15px; font-weight: 600">Due date</label><input id="ta-due" placeholder="No date" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #64748B; font: 400 15px 'Inter', sans-serif; outline: none"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="ta-est" style="font-size: 15px; font-weight: 600">Estimate</label><input id="ta-est" placeholder="e.g. 30 min" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #64748B; font: 400 15px 'Inter', sans-serif; outline: none"></div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 16px 24px 24px; border-top: 1px solid #E2E8F0">
      <span style="flex-grow: 1; font-size: 13px; color: #64748B">Tip: the quick-add bar is faster for one-liners.</span>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif">Cancel</button>
      <button type="submit" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #0F172A; color: #FFFFFF; font: 600 15px 'Inter', sans-serif">Add task</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
