<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1420px; box-sizing: border-box; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; gap: 18px; padding: 20px 0">
  <h1 style="margin: 0; padding: 0 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700">Lists and rows</h1>

  <section style="display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 36px; padding: 0 16px 8px">
      <h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">PRODUCE · 3</h2>
      <span style="font-size: 12px; color: #64748B">section header, shop-walk order</span>
    </div>
    <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px; border-bottom: 1px solid #F1F5F9">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #0F172A">
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px">Bananas</span><span style="font-size: 13px; line-height: 18px; color: #64748B">1 bunch · $2.50</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px; border-bottom: 1px solid #F1F5F9">
        <input type="checkbox" checked="{{true}}" style="width: 22px; height: 22px; accent-color: #0F172A">
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px; color: #64748B; text-decoration: line-through">Baby spinach</span><span style="font-size: 13px; line-height: 18px; color: #64748B">1 bag · $3.99</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px">
        <input type="checkbox" checked="{{true}}" style="width: 22px; height: 22px; accent-color: #0F172A">
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px">Avocados</span><span style="font-size: 13px; line-height: 18px; color: #B45309; font-weight: 600">Saving…</span></span>
      </label>
    </div>
  </section>

  <div role="status" style="margin: 0 16px; display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 14px; border-radius: 12px; background: #FFFBEB; border: 1px solid #FCD34D">
    <span style="flex-grow: 1; font-size: 13px; line-height: 18px; color: #92400E">Not saved — you're offline. Showing the last saved copy.</span>
    <button type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #92400E; font: 700 14px 'Inter', sans-serif">Retry</button>
  </div>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; padding: 0 16px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">NAVIGATION ROWS</h2>
    <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 14px 0 12px; border-bottom: 1px solid #F1F5F9; text-decoration: none; color: #0F172A">
        <dc-import name="Illustration" kind="addresses" size="40" hint-size="40px,40px"></dc-import>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 24px">Home <span style="padding: 1px 8px; border-radius: 999px; background: #CCFBF1; color: #115E59; font-size: 11px; font-weight: 600">CURRENT</span></span><span style="font-size: 13px; line-height: 18px; color: #64748B">3 of 5 places updated</span></span>
        <svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#94A3B8"></path></svg>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 14px 0 12px; text-decoration: none; color: #0F172A">
        <dc-import name="Illustration" kind="mobile" size="40" hint-size="40px,40px"></dc-import>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px">Personal</span><span style="font-size: 13px; line-height: 18px; color: #64748B; font-variant-numeric: tabular-nums">+61 412 345 678</span></span>
        <svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#94A3B8"></path></svg>
      </a>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; padding: 0 16px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">COPY A FIELD · TAP THE ROW</h2>
    <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
        <button type="button" aria-label="Copy {{f.label}}: {{f.value}}" style="display: flex; align-items: center; gap: 8px; min-height: 68px; padding: 0 6px 0 16px; border: 0; border-bottom: 1px solid #F1F5F9; background: #FFFFFF; text-align: left; font-family: 'Inter', sans-serif">
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 13px; line-height: 18px; color: #64748B">{{f.label}}</span><span style="font-size: 18px; line-height: 26px; font-weight: 500; color: #0F172A">{{f.value}}</span></span>
          <span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="5" y="5" width="10" height="11" rx="2" fill="#334155"></rect><rect x="2" y="2" width="10" height="11" rx="2" fill="#94A3B8"></rect></svg></span>
        </button>
      </sc-for>
    </div>
    <div style="margin: 4px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 15px 'Inter', sans-serif; color: #0F172A">Copy all</button>
      <button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 15px 'Inter', sans-serif; color: #0F172A">Share</button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; padding: 0 16px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">CHECKLIST ROW · USAGE LOCATIONS</h2>
    <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 12px 0 16px; border-bottom: 1px solid #F1F5F9">
        <input type="checkbox" checked="{{true}}" style="width: 22px; height: 22px; accent-color: #15803D">
        <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; line-height: 24px">Tax office</span><span style="font-size: 13px; line-height: 18px; color: #64748B">Government · online · changed 2 Oct</span></span>
        <span style="padding: 1px 8px; border-radius: 999px; background: #DCFCE7; color: #166534; font-size: 11px; font-weight: 600">CHANGED</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 12px 0 16px">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #15803D">
        <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; line-height: 24px">Bank</span><span style="font-size: 13px; line-height: 18px; color: #64748B">Finance · in person</span></span>
        <span style="padding: 1px 8px; border-radius: 999px; background: #FEE2E2; color: #B91C1C; font-size: 11px; font-weight: 600">HIGH</span>
      </label>
    </div>
  </section>

  <section aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; padding: 0 16px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">LOADING</h2>
    <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 22px; height: 22px; border-radius: 6px; background: #ECEEF0"></span><span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1"><span style="height: 12px; width: 55%; border-radius: 6px; background: #ECEEF0"></span><span style="height: 10px; width: 30%; border-radius: 5px; background: #ECEEF0"></span></span></div>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 22px; height: 22px; border-radius: 6px; background: #ECEEF0"></span><span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1"><span style="height: 12px; width: 42%; border-radius: 6px; background: #ECEEF0"></span><span style="height: 10px; width: 24%; border-radius: 5px; background: #ECEEF0"></span></span></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fields: [
        { label: 'Street', value: '14 Rose Lane' },
        { label: 'Suburb', value: 'Richmond VIC' },
        { label: 'Postcode', value: '3121' }
      ]
    };
  }
}
</script>
</body>
</html>
