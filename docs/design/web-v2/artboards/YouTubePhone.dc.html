<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone YouTube</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
    <a href="#" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>More</a>
    <button type="button" aria-label="Sync uploads" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3 A7 7 0 1 1 3.3 8 H5.4 A5 5 0 1 0 10 5 V7.5 L6.5 4 L10 0.5 Z" fill="#5B21B6"></path></svg></button>
  </div>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 12px"><dc-import name="Illustration" kind="youtube" size="44" hint-size="44px,44px"></dc-import><span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">YouTube</h1><span style="font-size: 13px; color: #64748B">Synced 08:12 · 24 new</span></span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: #ECEEF0">
      <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 15px 'Inter', sans-serif">Videos</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif">Shorts</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif">Channels</button>
    </div>
    <section aria-label="Now playing" style="display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: #FFFFFF; border: 1px solid #E2E8F0">
      <div style="aspect-ratio: 16 / 9; background: #0F172A; display: flex; align-items: center; justify-content: center"><button type="button" aria-label="Play" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #F97316; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5 L11.5 7 L4 11.5 Z" fill="#FFFFFF"></path></svg></button></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px"><span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 600">Building a weekend workbench</span><span style="font-size: 12px; color: #64748B">Maker Studio · 18 min</span></span><button type="button" style="height: 36px; padding: 0 10px; border-radius: 10px; border: 0; background: #0F172A; color: #FFFFFF; font: 600 13px 'Inter', sans-serif">Watched, next</button></div>
    </section>
    <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #E2E8F0; background: #FFFFFF; font: 600 15px 'Inter', sans-serif; text-align: left"><svg width="12" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#334155"></path></svg><span style="flex-grow: 1">Queue · 3 of 4</span><span style="font-weight: 400; color: #64748B">~42 min</span></button>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{uploads}}" as="u" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 72px; padding: 8px 6px 8px 12px; border-bottom: 1px solid #F1F5F9; box-sizing: border-box">
          <span aria-hidden="true" style="width: 88px; height: 50px; border-radius: 8px; background: #1D283A; flex-shrink: 0"></span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 14px; line-height: 18px; font-weight: 600">{{u.title}}</span><span style="font-size: 12px; color: #64748B">{{u.meta}}</span></span>
          <button type="button" aria-label="Add {{u.title}} to queue" style="width: 44px; height: 44px; border: 0; background: transparent; font: 700 22px 'Inter', sans-serif; color: #5B21B6">+</button>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { uploads: [
      { title: 'Five dinners under 30 minutes', meta: 'Home Kitchen · 5 h ago · new' },
      { title: 'Autumn garden jobs', meta: 'Plot to Plate · yesterday · new' },
      { title: 'Sharpening chisels properly', meta: 'Maker Studio · 2 d ago · new' }
    ] };
  }
}
</script>
</body>
</html>
