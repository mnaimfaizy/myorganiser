<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save your recovery key</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 56px; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <ol aria-label="Set up your vault" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px; width: 260px">
    <li style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #15803D; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M2.5 8.2 L6.2 11.8 L13.5 4.4 L12.1 3 L6.2 9 L3.9 6.8 Z" fill="#FFFFFF"></path></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Choose a passphrase</span><span style="font-size: 13px; color: #64748B">Done</span></span></li>
    <li aria-current="step" style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #7C3AED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 14px 'Inter', sans-serif">2</span><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Save your Recovery Key</span><span style="font-size: 13px; color: #5B21B6">Now</span></span></li>
    <li style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #E2E8F0; color: #475569; display: flex; align-items: center; justify-content: center; font: 700 14px 'Inter', sans-serif">3</span><span style="font-size: 15px; font-weight: 600; color: #475569">Start organising</span></li>
  </ol>
  <form aria-labelledby="rk-h" style="width: 560px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 36px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06)">
    <dc-import name="Illustration" kind="vault" size="80" hint-size="80px,80px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 id="rk-h" style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Save your Recovery Key</h1>
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #475569">If you forget your passphrase, this key is the only way back in. We can't reset it for you — nobody else can read your vault.</p>
    </div>
    <div style="padding: 16px; border-radius: 14px; background: #F8FAFC; border: 1px dashed #A78BFA; font-family: 'JetBrains Mono', monospace; font-size: 17px; line-height: 26px; letter-spacing: 0.04em; word-break: break-all">XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX (sample)</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #0F172A; color: #FFFFFF; font: 600 15px 'Inter', sans-serif">Download as a file</button>
      <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif">Copy</button>
    </div>
    <label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 12px; background: #FFFBEB; border: 1px solid #FCD34D; font-size: 15px; line-height: 20px"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #0F172A; flex-shrink: 0">I've saved it somewhere other than this device, like a password manager or on paper.</label>
    <button type="submit" disabled="{{true}}" style="height: 48px; border-radius: 12px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 16px 'Inter', sans-serif; opacity: 0.45">Continue</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
