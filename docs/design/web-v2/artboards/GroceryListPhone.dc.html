<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone grocery list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding-bottom: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 4px">
      <a href="GroceriesPhone.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>Groceries</a>
      <button type="button" aria-label="List actions" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="1.8" fill="#334155"></circle><circle cx="9" cy="9" r="1.8" fill="#334155"></circle><circle cx="14.5" cy="9" r="1.8" fill="#334155"></circle></svg></button>
    </div>
    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Weekly shop</h1>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span><b style="font-variant-numeric: tabular-nums">8 of 12</b> <span style="color: #64748B">checked</span></span><span style="color: #64748B">4 left</span></div>
      <div role="progressbar" aria-valuenow="8" aria-valuemin="0" aria-valuemax="12" aria-label="Weekly shop progress" style="height: 8px; border-radius: 999px; background: #ECEEF0; overflow: hidden"><div style="width: 67%; height: 8px; border-radius: 999px; background: #7C3AED"></div></div>
    </div>
  </div>

  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding-top: 6px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section aria-label="{{g.name}}" style="display: flex; flex-direction: column">
        <h2 style="margin: 0; display: flex; align-items: flex-end; gap: 8px; height: 36px; padding: 0 16px 8px; box-sizing: border-box; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #475569"><dc-import name="CategoryIllustration" category="{{g.key}}" size="24" hint-size="24px,24px"></dc-import>{{g.label}}</h2>
        <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px; border-bottom: 1px solid #F1F5F9">
              <input type="checkbox" style="width: 22px; height: 22px; accent-color: #0F172A; flex-shrink: 0">
              <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px">{{r.name}}</span><span style="font-size: 13px; line-height: 18px; color: #64748B">{{r.meta}}</span></span>
            </label>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <button type="button" aria-expanded="false" style="margin: 10px 16px 0; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #E2E8F0; background: #FFFFFF; font: 600 15px 'Inter', sans-serif; color: #0F172A; text-align: left">
      <svg width="12" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#334155"></path></svg>
      <span style="flex-grow: 1">Checked · 8</span><span style="font-weight: 400; color: #64748B">$28.30</span>
    </button>
  </main>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 30px; background: #FFFFFF; border-top: 1px solid #E2E8F0">
    <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">KNOWN SPEND</span><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums">$42.10 <span style="font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: #92400E">· 1 unpriced</span></span></span>
    <a href="GroceriesAddPhone.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 14px; border-radius: 14px; background: #7C3AED; color: #FFFFFF; font: 600 15px 'Inter', sans-serif; text-decoration: none"><svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true"><rect x="9.75" y="2" width="2.5" height="18" rx="1.25" fill="#FFFFFF"></rect><rect x="2" y="9.75" width="18" height="2.5" rx="1.25" fill="#FFFFFF"></rect></svg>Add item</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { produce: '#16A34A', dairy: '#0EA5E9', meat: '#DC2626' };
    const dot = (c) => 'width:8px;height:8px;border-radius:999px;background:' + colors[c];
    const groups = [
      { k: 'produce', name: 'Produce', rows: [{ name: 'Bananas', meta: '1 bunch · $2.50' }, { name: 'Avocados', meta: '3 · $4.50 · ripe ones' }] },
      { k: 'dairy', name: 'Dairy', rows: [{ name: 'Oat milk', meta: '2 · $5.20 · barista edition' }] },
      { k: 'meat', name: 'Meat', rows: [{ name: 'Chicken thighs', meta: '500g · no price' }] }
    ].map((g) => ({ name: g.name, label: g.name.toUpperCase() + ' · ' + g.rows.length, key: g.k, rows: g.rows }));
    return { groups };
  }
}
</script>
</body>
</html>
