<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone subscriptions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
    <a href="#" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>More</a>
    <a href="SubscriptionFormPhone.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 8px; color: #5B21B6; font: 700 17px 'Inter', sans-serif; text-decoration: none">Add</a>
  </div>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Illustration" kind="subscriptions" size="44" hint-size="44px,44px"></dc-import>
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Subscriptions</h1>
    </div>
    <section style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; background: #0F172A; color: #FFFFFF">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: #C4B5FD">EACH MONTH</span><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 800; font-variant-numeric: tabular-nums">A$54.97</span><span style="font-size: 13px; color: #CBD5E1">+ US$12.00 · 6 active</span></span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-size: 12px; color: #CBD5E1">Next</span><span style="padding: 2px 8px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600">In 3 days</span></span>
    </section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: #ECEEF0">
      <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 15px 'Inter', sans-serif; color: #0F172A">Active · 6</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif; color: #0F172A">Others · 5</button>
    </div>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{subs}}" as="s" hint-placeholder-count="5">
        <a href="{{s.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 14px 0 16px; border-bottom: 1px solid #F1F5F9; text-decoration: none; color: #0F172A">
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px">{{s.name}}</span><span style="font-size: 13px; line-height: 18px; color: #64748B; font-variant-numeric: tabular-nums">{{s.amount}}</span></span>
          <span style="{{s.dueStyle}}">{{s.due}}</span>
          <svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#94A3B8"></path></svg>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = (soon) => 'flex-shrink:0;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;' + (soon ? 'background:#FEF3C7;color:#92400E' : 'background:#F1F5F9;color:#475569');
    const subs = [
      { name: 'Streaming plan', amount: 'A$15.49 a month', due: 'In 3 days', dueStyle: d(true), href: 'SubscriptionDetailPhone.dc.html' },
      { name: 'Cloud storage', amount: 'A$2.99 a month', due: 'In 5 days', dueStyle: d(true), href: '#' },
      { name: 'Music', amount: 'A$12.99 a month', due: '2 Nov', dueStyle: d(false), href: '#' },
      { name: 'Design tool', amount: 'US$12.00 a month', due: '9 Nov', dueStyle: d(false), href: '#' },
      { name: 'News', amount: 'A$89.00 a year', due: '14 Jan', dueStyle: d(false), href: '#' }
    ];
    return { subs };
  }
}
</script>
</body>
</html>
