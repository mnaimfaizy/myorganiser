<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <main style="flex-grow: 1; overflow: hidden; box-sizing: border-box; padding: 4px 0 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: flex-end; height: 44px; align-items: center; padding-right: 8px">
      <button type="button" aria-label="Lock vault" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="10" width="14" height="10" rx="2.5" fill="#7C3AED"></rect><path d="M7 10 V7.5 C7 5 8.8 3 11 3 C13.2 3 15 5 15 7.5 V10 H13 V7.5 C13 6.1 12.1 5 11 5 C9.9 5 9 6.1 9 7.5 V10 Z" fill="#7C3AED"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px">
      <dc-import name="Illustration" kind="tasks" size="44" hint-size="44px,44px"></dc-import>
      <span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Tasks</h1><span style="font-size: 13px; line-height: 18px; color: #64748B">{{summary}}</span></span>
    </div>
    <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: #ECEEF0">
      <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 15px 'Inter', sans-serif; color: #0F172A">All</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif; color: #0F172A">Personal</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif; color: #0F172A">Work</button>
    </div>

    <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section aria-label="{{g.name}}" style="display: flex; flex-direction: column">
          <h2 style="{{g.headStyle}}">{{g.label}}</h2>
          <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
            <sc-for list="{{g.rows}}" as="t" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 4px; min-height: 64px; padding: 0 8px 0 6px; border-bottom: 1px solid #F1F5F9">
                <label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><input type="checkbox" aria-label="Done: {{t.title}}" style="width: 22px; height: 22px; accent-color: #0F172A"></label>
                <a href="TaskDetailPhone.dc.html" style="display: flex; align-items: center; gap: 8px; flex-grow: 1; min-width: 0; min-height: 64px; text-decoration: none; color: #0F172A">
                  <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 17px; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.title}}</span><span style="font-size: 13px; line-height: 18px; color: #64748B">{{t.meta}}</span></span>
                  <sc-if value="{{t.hasPill}}" hint-placeholder-val="{{false}}"><span style="{{t.pillStyle}}">{{t.pill}}</span></sc-if>
                </a>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </sc-if>

    <sc-if value="{{isClear}}" hint-placeholder-val="{{false}}">
      <section style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 32px 120px; text-align: center">
        <dc-import name="Illustration" kind="tasks" size="96" hint-size="96px,96px"></dc-import>
        <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700">All clear</h2>
        <p style="margin: 0; font-size: 15px; line-height: 20px; color: #475569">Nothing open. 4 tasks done this week.</p>
        <button type="button" style="margin-top: 4px; height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 15px 'Inter', sans-serif; color: #0F172A">Show done</button>
      </section>
    </sc-if>
  </main>
  <a href="TaskCapturePhone.dc.html" aria-label="Add task" style="position: absolute; right: 16px; bottom: 104px; width: 56px; height: 56px; border-radius: 18px; background: #7C3AED; box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="9.75" y="2" width="2.5" height="18" rx="1.25" fill="#FFFFFF"></rect><rect x="2" y="9.75" width="18" height="2.5" rx="1.25" fill="#FFFFFF"></rect></svg></a>
  <dc-import name="TabBar" active="tasks" hint-size="390px,88px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["list","allclear"],"default":"list","section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const clear = (this.props.view ?? 'list') === 'allclear';
    const pill = (bg, fg) => 'flex-shrink:0;padding:2px 8px;border-radius:999px;font-size:11px;line-height:16px;font-weight:600;letter-spacing:0.02em;background:' + bg + ';color:' + fg;
    const t = (title, meta, p) => ({ title, meta, hasPill: !!p, pill: p ? p[0] : '', pillStyle: p ? pill(p[1], p[2]) : '' });
    const head = (c) => 'margin:0;display:flex;align-items:flex-end;height:36px;padding:0 16px 8px;box-sizing:border-box;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.02em;color:' + c;
    const groups = [
      { name: 'Overdue', label: 'OVERDUE · 1', headStyle: head('#B91C1C'), rows: [t('Pay council tax', 'Yesterday · Personal', ['HIGH', '#FEE2E2', '#B91C1C'])] },
      { name: 'Today', label: 'TODAY · 3', headStyle: head('#92400E'), rows: [
        t('Book dentist appointment', 'Personal · 15 min'),
        t('Send rent receipt', 'Personal'),
        t('Review Q4 budget draft', 'Work', ['IN PROGRESS', '#EDE9FE', '#5B21B6'])
      ] },
      { name: 'Upcoming', label: 'UPCOMING · 3', headStyle: head('#475569'), rows: [
        t('Renew passport', 'Fri 24 Oct · Personal', ['BLOCKED', '#FEF3C7', '#92400E'])
      ] }
    ];
    return { isList: !clear, isClear: clear, summary: clear ? 'Nothing open' : '12 open · 3 today · 1 overdue', groups };
  }
}
</script>
</body>
</html>
