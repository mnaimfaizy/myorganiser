      <label for="tdp-n" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">DESCRIPTION</label>

    </div>

    <div style="margin: auto 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 16px 'Inter', sans-serif; color: #0F172A">Archive</button>
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #FCA5A5; background: #FFFFFF; font: 600 16px 'Inter', sans-serif; color: #B91C1C">Delete…</button>
