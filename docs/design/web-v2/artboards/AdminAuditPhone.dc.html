<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone admin audit log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 52px 16px 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Illustration" kind="audit" size="44" hint-size="44px,44px"></dc-import>
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.02em">Audit log</h1>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 14px 'Inter', sans-serif; color: #0F172A">Filters · 1</button>
    </div>
    <div class="chips" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; border-radius: 999px; background: #EDE9FE; color: #5B21B6; font-size: 13px; font-weight: 600">Last 30 days<button type="button" aria-label="Remove filter Last 30 days" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #DDD6FE; color: #5B21B6; font: 700 13px 'Inter', sans-serif">×</button></span>
    </div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <h2 style="margin: 6px 0 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">{{d.label}}</h2>
      <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
        <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1px solid #F1F5F9">
            <span style="display: flex; align-items: center; gap: 8px"><span style="{{r.pillStyle}}">{{r.action}}</span><span style="flex-grow: 1"></span><span style="font-size: 13px; color: #64748B">{{r.time}}</span></span>
            <span style="font-size: 15px"><strong style="font-weight: 600">{{r.actor}}</strong> → {{r.target}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </main>
  <nav aria-label="Admin sections" style="width: 390px; height: 88px; box-sizing: border-box; padding: 8px 8px 18px; display: flex; justify-content: space-around; align-items: flex-start; background: #FFFFFF; border-top: 1px solid #E2E8F0">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; min-height: 60px; text-decoration: none">
        <span style="{{t.pillStyle}}">
          <sc-if value="{{t.isApp}}" hint-placeholder-val="{{false}}">
            <svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2 L32 7 V17 C32 26 25 32 18 34 C11 32 4 26 4 17 V7 Z" fill="#7C3AED"></path><path d="M4 17 C4 26 11 32 18 34 C25 32 32 26 32 17 Z" fill="#0F766E"></path><path d="M11.5 17.5 L16 22 L25 12.5 L27.2 14.6 L16 26 L9.3 19.6 Z" fill="#FFFFFF"></path></svg>
          </sc-if>
          <sc-if value="{{t.isSection}}" hint-placeholder-val="{{true}}">
            <dc-import name="Illustration" kind="{{t.kind}}" size="28" hint-size="28px,28px"></dc-import>
          </sc-if>
        </span>
        <span style="{{t.labelStyle}}">{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = [
      { kind: 'admin', label: 'Overview' },
      { kind: 'users', label: 'Users' },
      { kind: 'audit', label: 'Audit log' },
      { kind: 'inbox', label: 'Feedback' },
      { kind: 'app', label: 'My app' }
    ].map((t) => {
      const on = t.kind === 'audit';
      return {
        kind: t.kind,
        label: t.label,
        isApp: t.kind === 'app',
        isSection: t.kind !== 'app',
        current: on ? 'page' : 'false',
        pillStyle: 'display:flex;align-items:center;justify-content:center;width:56px;height:36px;border-radius:999px;background:' + (on ? '#EDE9FE' : 'transparent'),
        labelStyle: 'font-size:12px;line-height:16px;font-weight:' + (on ? 600 : 500) + ';color:' + (on ? '#5B21B6' : '#475569')
      };
    });
    const pill = (bg, fg) => 'flex-shrink:0;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em;background:' + bg + ';color:' + fg;
    const k = { GRANT: pill('#EDE9FE', '#5B21B6'), ENABLE: pill('#CCFBF1', '#115E59'), DISABLE: pill('#FEE2E2', '#B91C1C'), RESEND: pill('#F1F5F9', '#334155'), LOGOUT: pill('#FEF3C7', '#92400E') };
    const names = { GRANT: 'GRANT YOUTUBE', RESEND: 'RESEND EMAIL', LOGOUT: 'FORCE LOGOUT', ENABLE: 'ENABLE', DISABLE: 'DISABLE' };
    const r = (a, t, actor, target) => ({ action: names[a], pillStyle: k[a], time: t, actor, target });
    const days = [
      { label: 'TODAY', rows: [r('GRANT', '10:42', 'Sam Miller', 'Ana Costa'), r('ENABLE', '09:58', 'Sam Miller', 'Mia Wong'), r('RESEND', '09:15', 'Sam Miller', 'Priya Shah')] },
      { label: 'YESTERDAY', rows: [r('DISABLE', '17:20', 'Jo Park', 'Leo Martin'), r('LOGOUT', '11:02', 'Jo Park', 'Ben Lee')] }
    ];
    return { tabs, days };
  }
}
</script>
</body>
</html>
