<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone subscription detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
    <a href="SubscriptionsPhone.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>Subscriptions</a>
    <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B21B6; font: 700 17px 'Inter', sans-serif">Edit</button>
  </div>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.02em">Streaming plan</h1>
      <span style="display: flex; gap: 6px"><span style="padding: 2px 8px; border-radius: 999px; background: #CCFBF1; color: #115E59; font-size: 11px; font-weight: 600">ACTIVE</span><span style="padding: 2px 8px; border-radius: 999px; background: #F1F5F9; color: #475569; font-size: 11px; font-weight: 600">FAMILY</span></span>
    </div>
    <section style="display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E8F0">
      <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 800; font-variant-numeric: tabular-nums">A$15.49</span><span style="font-size: 15px; color: #64748B">a month</span></span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="padding: 2px 8px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600">In 3 days</span>Renews Tue 21 Oct</span>
    </section>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #F1F5F9"><span style="font-size: 15px; color: #475569">{{r.k}}</span><span style="font-size: 15px; font-weight: 500">{{r.v}}</span></div>
      </sc-for>
      <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; text-decoration: none; color: #5B21B6; font-size: 15px; font-weight: 600">Manage plan on the website<span aria-hidden="true">↗</span></a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: auto; margin-bottom: 24px">
      <button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 16px 'Inter', sans-serif; color: #0F172A">Mark cancelled</button>
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #FCA5A5; background: #FFFFFF; font: 600 16px 'Inter', sans-serif; color: #B91C1C">Delete…</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [['Billed', 'Monthly'], ['Started', '3 Mar 2024'], ['Renewal', 'Auto renew'], ['Pays with', 'Credit card'], ['Ends', 'No end date']].map(([k, v]) => ({ k, v })) };
  }
}
</script>
</body>
</html>
