<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add place dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input::placeholder{color:#64748B}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.4)"></div>
  <form role="dialog" aria-labelledby="pd-t" aria-describedby="pd-d" style="position: absolute; left: 50%; top: 64px; transform: translateX(-50%); width: 600px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 24px; background: #FFFFFF; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2)">
    <div style="display: flex; align-items: flex-start; gap: 14px; padding: 24px 24px 16px; border-bottom: 1px solid #E2E8F0">
      <dc-import name="Illustration" kind="{{illo}}" size="48" hint-size="48px,48px"></dc-import>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <h2 id="pd-t" style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700">Add place</h2>
        <span id="pd-d" style="font-size: 15px; line-height: 20px; color: #475569">Who needs to know about {{subject}}?</span>
      </span>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="1" width="2.2" height="16" rx="1.1" fill="#334155" transform="rotate(45 9 9)"></rect><rect x="8" y="1" width="2.2" height="16" rx="1.1" fill="#334155" transform="rotate(-45 9 9)"></rect></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 24px">
      <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="pd-o" style="font-size: 15px; font-weight: 600">Organisation</label><input id="pd-o" value="Bank" style="height: 44px; box-sizing: border-box; padding: 0 13px; border-radius: 12px; border: 2px solid #0F172A; font: 400 16px 'Inter', sans-serif; outline: none"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="pd-ty" style="font-size: 15px; font-weight: 600">Type</label><button id="pd-ty" type="button" aria-haspopup="listbox" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px 0 14px; border-radius: 12px; border: 1px solid #64748B; background: #FFFFFF; font: 400 16px 'Inter', sans-serif; color: #0F172A">Finance<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 4.5 L7 10 L12.5 4.5 L11.1 3.1 L7 7.2 L2.9 3.1 Z" fill="#334155"></path></svg></button></div>
      </div>
      <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #FFFBEB; border: 1px solid #FCD34D">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="10" cy="10" r="9" fill="#B45309"></circle><rect x="9" y="5" width="2" height="6.5" rx="1" fill="#FFFFFF"></rect><circle cx="10" cy="14.5" r="1.3" fill="#FFFFFF"></circle></svg>
        <span style="font-size: 13px; line-height: 18px; color: #334155"><b style="color: #92400E">“Bank” is already on this {{noun}}.</b> Add it again only if it's a different account.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 600">How to update</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: #ECEEF0">
          <button type="button" aria-pressed="true" style="height: 38px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 14px 'Inter', sans-serif">Online</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; font: 500 14px 'Inter', sans-serif">Phone</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; font: 500 14px 'Inter', sans-serif">Mail</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; font: 500 14px 'Inter', sans-serif">In person</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 600">Priority</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: #ECEEF0">
          <button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; font: 500 14px 'Inter', sans-serif">Low</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; font: 500 14px 'Inter', sans-serif">Normal</button>
          <button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 9px; background: transparent; font: 500 14px 'Inter', sans-serif">Medium</button>
          <button type="button" aria-pressed="true" style="height: 38px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 14px 'Inter', sans-serif">High</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pd-l" style="font-size: 15px; font-weight: 600">Where to change it <span style="font-weight: 400; color: #64748B">· optional</span></label><input id="pd-l" placeholder="https://" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #64748B; font: 400 16px 'Inter', sans-serif; outline: none"><span style="font-size: 13px; color: #64748B">A link to the page where you update your details.</span></div>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #15803D"><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Already updated</span><span style="font-size: 13px; color: #64748B">Records today's date</span></span></label>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 24px; border-top: 1px solid #E2E8F0">
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif">Cancel</button>
      <button type="submit" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #0F172A; color: #FFFFFF; font: 600 15px 'Inter', sans-serif">Add anyway</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"subject":{"editor":"text","default":"Home"},"noun":{"editor":"enum","options":["address","number"],"default":"address"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const noun = this.props.noun ?? 'address';
    return { subject: this.props.subject ?? 'Home', noun, illo: noun === 'number' ? 'mobile' : 'addresses' };
  }
}
</script>
</body>
</html>
