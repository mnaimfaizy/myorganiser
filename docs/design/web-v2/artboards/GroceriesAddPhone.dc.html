    </div>
    <button type="button" style="margin: 14px 16px 0; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 14px; border: 1px dashed #A78BFA; background: #FAF5FF; font-family: 'Inter', sans-serif; text-align: left">

      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #64748B; background: #FFFFFF; font: 500 15px 'Inter', sans-serif">+ Bread</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #64748B; background: #FFFFFF; font: 500 15px 'Inter', sans-serif">+ Spinach</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #64748B; background: #FFFFFF; font: 500 15px 'Inter', sans-serif">+ Coffee</button>
