<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <main style="flex-grow: 1; overflow: hidden; box-sizing: border-box; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; gap: 12px; min-height: 56px">
      <button type="button" aria-label="Account menu for Sam Miller" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #7C3AED; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif">SM</button>
      <span style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 13px; line-height: 18px; color: #64748B">Good afternoon</span>
        <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.015em">Sam</h1>
      </span>
      <sc-if value="{{unlocked}}" hint-placeholder-val="{{true}}">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: #CCFBF1; color: #115E59; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: #0F766E"></span>Synced</span>
        <button type="button" aria-label="Lock vault" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E2E8F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="10" width="14" height="10" rx="2.5" fill="#7C3AED"></rect><path d="M7 10 V7.5 C7 5 8.8 3 11 3 C13.2 3 15 5 15 7.5 V10 H13 V7.5 C13 6.1 12.1 5 11 5 C9.9 5 9 6.1 9 7.5 V10 Z" fill="#7C3AED"></path></svg></button>
      </sc-if>
      <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: #B45309"></span>Locked</span>
      </sc-if>
    </header>

    <sc-if value="{{unlocked}}" hint-placeholder-val="{{true}}">
      <section aria-label="Today" style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 22px; background: #0F172A">
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
          <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #C4B5FD">TODAY</span>
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; color: #FFFFFF">4 tasks due</span>
          <div role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="4" aria-label="Today's tasks done" style="height: 8px; border-radius: 999px; background: #1D283A; overflow: hidden"><div style="width: 25%; height: 8px; border-radius: 999px; background: #22D3EE"></div></div>
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #CBD5E1">1 of 4 done · 2 renew this week</span><a href="#" style="font-size: 13px; font-weight: 600; color: #C4B5FD; text-decoration: none">Open</a></div>
        </div>
        <dc-import name="Illustration" kind="tasks" size="64" hint-size="64px,64px"></dc-import>
      </section>
    </sc-if>
    <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
      <section aria-label="Vault locked" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 22px; background: #0F172A">
        <div style="display: flex; align-items: center; gap: 14px">
          <dc-import name="Illustration" kind="vault" size="64" hint-size="64px,64px"></dc-import>
          <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; color: #FFFFFF">Vault locked</span><span style="font-size: 13px; line-height: 18px; color: #CBD5E1">Locked after 5 minutes away. Your data stayed encrypted.</span></span>
        </div>
        <button type="button" style="height: 48px; border-radius: 12px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 16px 'Inter', sans-serif">Unlock</button>
        <a href="#" style="align-self: center; font-size: 13px; font-weight: 600; color: #C4B5FD; text-decoration: none; padding: 6px">Use recovery key instead</a>
      </section>
    </sc-if>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; line-height: 22px; font-weight: 700">Your spaces</h2>
      <span style="font-size: 12px; color: #64748B">Encrypted</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <a href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0; text-decoration: none; color: #0F172A">
          <span style="display: flex; justify-content: space-between; align-items: flex-start"><dc-import name="Illustration" kind="{{t.kind}}" size="48" hint-size="48px,48px"></dc-import><sc-if value="{{t.hasPill}}" hint-placeholder-val="{{false}}"><span style="{{t.pillStyle}}">{{t.pill}}</span></sc-if></span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px; font-weight: 600">{{t.label}}</span><span style="font-size: 13px; line-height: 18px; color: #64748B">{{t.meta}}</span></span>
        </a>
      </sc-for>
    </div>
  </main>

  <sc-if value="{{unlocked}}" hint-placeholder-val="{{true}}">
    <button type="button" aria-label="Quick add" style="position: absolute; right: 16px; bottom: 104px; width: 56px; height: 56px; border-radius: 18px; border: 0; background: #7C3AED; box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="9.75" y="2" width="2.5" height="18" rx="1.25" fill="#FFFFFF"></rect><rect x="2" y="9.75" width="18" height="2.5" rx="1.25" fill="#FFFFFF"></rect></svg></button>
  </sc-if>
  <dc-import name="TabBar" active="home" hint-size="390px,88px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vault":{"editor":"enum","options":["unlocked","locked"],"default":"unlocked","section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const locked = (this.props.vault ?? 'unlocked') === 'locked';
    const pill = (bg, fg) => 'padding:2px 8px;border-radius:999px;font-size:11px;line-height:16px;font-weight:600;background:' + bg + ';color:' + fg;
    const warn = pill('#FEF3C7', '#92400E');
    const lock = pill('#F1F5F9', '#475569');
    const open = [
      { kind: 'groceries', label: 'Groceries', meta: '4 lists · 9 left', pill: '', pillStyle: '' },
      { kind: 'subscriptions', label: 'Subscriptions', meta: '$54.97 a month', pill: '2 soon', pillStyle: warn },
      { kind: 'addresses', label: 'Addresses', meta: '3 of 5 updated', pill: '', pillStyle: '' },
      { kind: 'mobile', label: 'Mobile numbers', meta: '5 saved', pill: '', pillStyle: '' },
      { kind: 'youtube', label: 'YouTube', meta: '24 new videos', pill: '', pillStyle: '' },
      { kind: 'vault', label: 'Vault', meta: 'Backed up 2 d ago', pill: '', pillStyle: '' }
    ];
    const tiles = open.map((t) => {
      if (locked && t.kind !== 'youtube') return { kind: t.kind, label: t.label, meta: 'Encrypted', hasPill: true, pill: 'Locked', pillStyle: lock };
      return { kind: t.kind, label: t.label, meta: t.meta, hasPill: !!t.pill, pill: t.pill, pillStyle: t.pillStyle };
    });
    return { locked, unlocked: !locked, tiles };
  }
}
</script>
</body>
</html>
