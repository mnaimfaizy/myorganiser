<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone addresses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
input::placeholder{color:#64748B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
    <a href="#" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>More</a>
    <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B21B6; font: 700 17px 'Inter', sans-serif">Add</button>
  </div>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Illustration" kind="addresses" size="44" hint-size="44px,44px"></dc-import>
      <span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Addresses</h1><span style="font-size: 13px; line-height: 18px; color: #64748B">3 saved · 2 places to update</span></span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: #ECEEF0">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.5" fill="#64748B"></circle><circle cx="7.5" cy="7.5" r="4.6" fill="#ECEEF0"></circle><rect x="11" y="10" width="2.2" height="7" rx="1.1" fill="#64748B" transform="rotate(-45 12.1 13.5)"></rect></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Filter addresses</span>
      <input placeholder="Filter addresses" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; outline: none; font: 400 17px 'Inter', sans-serif">
    </label>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{items}}" as="a" hint-placeholder-count="3">
        <a href="{{a.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 88px; padding: 10px 14px 10px 16px; border-bottom: 1px solid #F1F5F9; text-decoration: none; color: #0F172A; box-sizing: border-box">
          <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 24px; font-weight: 600">{{a.label}}<span style="{{a.pillStyle}}">{{a.status}}</span></span>
            <span style="font-size: 13px; line-height: 18px; color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.line}}</span>
            <span style="{{a.progressStyle}}">{{a.progress}}</span>
          </span>
          <svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#94A3B8"></path></svg>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (cur) => 'display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em;' + (cur ? 'background:#CCFBF1;color:#115E59' : 'background:#F1F5F9;color:#475569');
    const prog = (c) => 'font-size:13px;line-height:18px;font-weight:600;color:' + c;
    const items = [
      { label: 'Home', status: 'CURRENT', pillStyle: pill(true), line: '14 Rose Lane, Richmond VIC 3121', progress: '3 of 5 places updated', progressStyle: prog('#92400E'), href: 'AddressDetailPhone.dc.html' },
      { label: 'Old flat', status: 'OLD', pillStyle: pill(false), line: '2/88 Station Street, Fitzroy VIC 3065', progress: 'All 6 places updated', progressStyle: prog('#15803D'), href: '#' },
      { label: 'Parents', status: 'OLD', pillStyle: pill(false), line: '7 Hill Road, Ballarat VIC 3350', progress: 'No places yet', progressStyle: prog('#64748B'), href: '#' }
    ];
    return { items };
  }
}
</script>
</body>
</html>
