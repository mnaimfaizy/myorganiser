<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fix Notice unsubscribe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 56px 16px; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <a href="#" aria-label="MyOrganiser home" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
    <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2 L32 7 V17 C32 26 25 32 18 34 C11 32 4 26 4 17 V7 Z" fill="#7C3AED"></path><path d="M4 17 C4 26 11 32 18 34 C25 32 32 26 32 17 Z" fill="#0F766E"></path><path d="M11.5 17.5 L16 22 L25 12.5 L27.2 14.6 L16 26 L9.3 19.6 Z" fill="#FFFFFF"></path></svg>
    <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; color: #0F172A">My<span style="font-weight: 800">Organiser</span></span>
  </a>
  <section role="status" style="width: 100%; max-width: 460px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 36px 28px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06); text-align: center">
    <dc-import name="Illustration" kind="feedback" size="96" hint-size="96px,96px"></dc-import>
    <h1 style="{{headingStyle}}">{{heading}}</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #475569">{{text}}</p>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px">
      <sc-if value="{{hasRetry}}" hint-placeholder-val="{{false}}">
        <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif; color: #0F172A">Try again</button>
      </sc-if>
      <sc-if value="{{hasCta}}" hint-placeholder-val="{{true}}">
        <a href="#" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; background: #0F172A; color: #FFFFFF; font: 600 15px 'Inter', sans-serif; text-decoration: none">{{cta}}</a>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["working","done","invalid","error"],"default":"done","section":"State"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'done';
    const copy = {
      working: { heading: 'Updating your notification preferences…', text: 'Please wait while we process your request.', cta: '' },
      done: { heading: 'Fix Notices turned off', text: 'You will no longer receive an email when one of your Feedback Reports is fixed or shipped. You can still see the outcome any time on your reports page.', cta: 'Go to your reports' },
      invalid: { heading: 'Link no longer valid', text: 'This unsubscribe link has expired or is no longer valid. You can manage your Feedback Report notifications from your account.', cta: 'Go to account settings' },
      error: { heading: 'Something went wrong', text: "We couldn't process your request. Please try again or visit your reports page.", cta: 'Go to your reports' }
    }[st];
    return {
      ...copy,
      hasCta: !!copy.cta,
      hasRetry: st === 'error',
      headingStyle: "margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;line-height:30px;font-weight:700;color:" + (st === 'error' ? '#B91C1C' : '#0F172A')
    };
  }
}
</script>
</body>
</html>
