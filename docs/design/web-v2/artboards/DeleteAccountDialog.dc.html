<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm account deletion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.4)"></div>
  <form role="alertdialog" aria-labelledby="da-t" aria-describedby="da-d" style="position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: 520px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 24px; background: #FFFFFF; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2)">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 24px 24px 16px; border-bottom: 1px solid #E2E8F0">
      <span style="font-size: 13px; font-weight: 600; color: #B91C1C">Step 2 of 2</span>
      <h2 id="da-t" style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700">Confirm account deletion</h2>
      <p id="da-d" style="margin: 0; font-size: 15px; line-height: 20px; color: #475569">This cannot be undone. Your account, its Sessions, and your encrypted vault will be removed from our servers. Feedback Reports you've sent stay on our servers, but with your name and email removed — you won't be contacted about them again.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 24px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="da-p" style="font-size: 15px; font-weight: 600">Account password</label>
        <input id="da-p" type="password" autocomplete="current-password" value="••••••••••" aria-invalid="true" aria-describedby="da-pe" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid #DC2626; font: 400 17px 'Inter', sans-serif; outline: none">
        <span id="da-pe" style="font-size: 13px; color: #B91C1C">Incorrect password.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="da-c" style="font-size: 15px; font-weight: 600">Type DELETE to confirm</label>
        <input id="da-c" type="text" value="DELETE" autocomplete="off" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #CBD5E1; font: 600 17px 'Inter', sans-serif; letter-spacing: 0.06em">
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 24px; border-top: 1px solid #E2E8F0">
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif; color: #0F172A">Back</button>
      <button type="submit" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #DC2626; color: #FFFFFF; font: 600 15px 'Inter', sans-serif">Delete my account</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
