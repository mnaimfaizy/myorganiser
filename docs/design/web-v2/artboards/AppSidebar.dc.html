<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="Main navigation" style="width: 272px; min-height: {{minh}}; height: 100%; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; background: #0F172A; font-family: 'Inter', system-ui, sans-serif">
  <a href="#" aria-label="MyOrganiser home" style="display: flex; align-items: center; gap: 12px; padding: 4px 6px; text-decoration: none">
    <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2 L32 7 V17 C32 26 25 32 18 34 C11 32 4 26 4 17 V7 Z" fill="#7C3AED"></path><path d="M4 17 C4 26 11 32 18 34 C25 32 32 26 32 17 Z" fill="#0F766E"></path><path d="M11.5 17.5 L16 22 L25 12.5 L27.2 14.6 L16 26 L9.3 19.6 Z" fill="#FFFFFF"></path></svg>
    <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; color: #FFFFFF">My<span style="font-weight: 800">Organiser</span></span>
  </a>
  <nav aria-label="Sections" style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="13">
      <sc-if value="{{n.isHeader}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #94A3B8; padding: 12px 10px 4px">{{n.label}}</span>
      </sc-if>
      <sc-if value="{{n.isLink}}" hint-placeholder-val="{{true}}">
        <a href="#" aria-current="{{n.current}}" style="{{n.row}}">
          <dc-import name="Illustration" kind="{{n.kind}}" size="36" hint-size="36px,36px"></dc-import>
          <span style="{{n.labelStyle}}">{{n.label}}</span>
          <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{n.badgeStyle}}">{{n.badge}}</span></sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
  <button type="button" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 10px; border-radius: 12px; border: 0; background: transparent; color: #E2E8F0; font: 500 15px 'Inter', sans-serif; text-align: left"><dc-import name="Illustration" kind="feedback" size="32" hint-size="32px,32px"></dc-import>Send feedback</button>
  <sc-if value="{{unlocked}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #1D283A">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #FFFFFF"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #14B8A6"></span>Vault unlocked</span>
      <span style="font-size: 13px; line-height: 18px; color: #94A3B8">Synced 2 minutes ago</span>
      <button type="button" style="height: 40px; border-radius: 10px; border: 1px solid #334155; background: transparent; color: #FFFFFF; font: 600 14px 'Inter', sans-serif">Lock vault</button>
    </div>
  </sc-if>
  <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #1D283A">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #FFFFFF"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: #F59E0B"></span>Vault locked</span>
      <span style="font-size: 13px; line-height: 18px; color: #94A3B8">Your data stays encrypted on this device</span>
      <button type="button" style="height: 40px; border-radius: 10px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 14px 'Inter', sans-serif">Unlock</button>
    </div>
  </sc-if>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","tasks","groceries","subscriptions","addresses","mobile","youtube","vault","none"],"default":"home"},"vaultLocked":{"editor":"boolean","default":false},"minHeight":{"editor":"int","min":600,"max":3000,"default":1100},"$preview":{"width":272,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const locked = this.props.vaultLocked === true || this.props.vaultLocked === 'true';
    const raw = [
      { h: 'OVERVIEW' }, { k: 'home', l: 'Home' },
      { h: 'ORGANISE' }, { k: 'tasks', l: 'Tasks', b: '4' }, { k: 'groceries', l: 'Groceries', b: '3' }, { k: 'subscriptions', l: 'Subscriptions' },
      { h: 'PEOPLE AND PLACES' }, { k: 'addresses', l: 'Addresses' }, { k: 'mobile', l: 'Mobile numbers' },
      { h: 'MEDIA' }, { k: 'youtube', l: 'YouTube' },
      { h: 'SECURITY' }, { k: 'vault', l: 'Vault' }
    ];
    const nav = raw.map((r) => {
      if (r.h) return { isHeader: true, isLink: false, label: r.h };
      const a = r.k === active;
      const badge = locked ? '' : r.b;
      return {
        isHeader: false, isLink: true, kind: r.k, label: r.l,
        current: a ? 'page' : 'false',
        hasBadge: !!badge, badge,
        row: 'display:flex;align-items:center;gap:12px;min-height:46px;box-sizing:border-box;padding:4px 10px 4px 4px;border-radius:14px;text-decoration:none;border:1px solid ' + (a ? '#7C3AED' : 'transparent') + ';background:' + (a ? 'rgba(124,58,237,0.24)' : 'transparent'),
        labelStyle: 'flex-grow:1;font-size:15px;line-height:20px;font-weight:' + (a ? 600 : 500) + ';color:' + (a ? '#FFFFFF' : '#CBD5E1'),
        badgeStyle: 'min-width:24px;text-align:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:' + (a ? '#7C3AED' : '#1D283A') + ';color:' + (a ? '#FFFFFF' : '#CBD5E1')
      };
    });
    const mh = Number(this.props.minHeight ?? 1100) || 1100;
    return { nav, unlocked: !locked, locked, minh: mh + 'px' };
  }
}
</script>
</body>
</html>
