<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grocery List</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#5B21B6}a:hover{color:#4C1D95}
input::placeholder{color:#64748B}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1240px; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="flex: 0 0 272px; display: flex">
    <dc-import name="AppSidebar" active="groceries" min-height="1240" hint-size="272px,1240px"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="AppHeader" title="Weekly shop" crumb="Groceries" state="synced" hint-size="100%,76px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1200px; margin: 0 auto; padding: 32px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span style="display: flex; flex-direction: column; flex-grow: 1">
            <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Weekly shop</h1>
            <span style="font-size: 15px; line-height: 20px; color: #64748B">12 items · updated 2 hours ago</span>
          </span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 14px; border-radius: 12px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 15px 'Inter', sans-serif"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="2" width="2" height="14" rx="1" fill="#FFFFFF"></rect><rect x="2" y="8" width="14" height="2" rx="1" fill="#FFFFFF"></rect></svg>Add item</button>
        </div>

        <section aria-label="Add from your Catalog" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #64748B">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.5" fill="#64748B"></circle><circle cx="7.5" cy="7.5" r="4.6" fill="#FFFFFF"></circle><rect x="11" y="10" width="2.2" height="7" rx="1.1" fill="#64748B" transform="rotate(-45 12.1 13.5)"></rect></svg>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Add from your Catalog</span>
            <input placeholder="Add from your Catalog — type a name" style="flex-grow: 1; border: 0; outline: none; font: 400 16px 'Inter', sans-serif; min-width: 0">
          </label>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{suggest}}" as="s" hint-placeholder-count="5">
              <button type="button" disabled="{{s.on}}" style="{{s.style}}"><dc-import name="CategoryIllustration" category="{{s.cat}}" size="20" hint-size="20px,20px"></dc-import>{{s.name}}<span style="color: #64748B; font-variant-numeric: tabular-nums">{{s.price}}</span></button>
            </sc-for>
          </div>
        </section>

        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 8px">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #475569"><dc-import name="CategoryIllustration" category="{{g.key}}" size="24" hint-size="24px,24px"></dc-import>{{g.label}}</h2>
            <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
                <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 8px 0 16px; border-bottom: 1px solid #F1F5F9">
                  <input type="checkbox" aria-label="Bought {{r.name}}" style="width: 22px; height: 22px; accent-color: #0F172A; flex-shrink: 0">
                  <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
                    <span style="font-size: 17px; line-height: 24px">{{r.name}}</span>
                    <span style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; line-height: 18px; color: #64748B"><span>{{r.meta}}</span><sc-if value="{{r.unpriced}}" hint-placeholder-val="{{false}}"><span style="color: #92400E; font-weight: 600">No price</span></sc-if><sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}"><span>· {{r.note}}</span></sc-if></span>
                  </span>
                  <button type="button" aria-label="Edit amount for {{r.name}}" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M12.6 2.2 L15.8 5.4 L6.4 14.8 L2.4 15.6 L3.2 11.6 Z" fill="#475569"></path></svg></button>
                  <button type="button" aria-label="More for {{r.name}}" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="3.5" r="1.8" fill="#475569"></circle><circle cx="9" cy="9" r="1.8" fill="#475569"></circle><circle cx="9" cy="14.5" r="1.8" fill="#475569"></circle></svg></button>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-for>

        <section aria-label="Checked" style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px 10px 16px">
            <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 8px; flex-grow: 1; height: 44px; border: 0; background: transparent; text-align: left; font: 600 15px 'Inter', sans-serif; color: #0F172A">
              <svg width="12" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#334155"></path></svg>Checked · 8 <span style="font-weight: 400; color: #64748B">· $28.30</span>
            </button>
            <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: #ECEEF0; font: 600 14px 'Inter', sans-serif; color: #0F172A">Uncheck All</button>
            <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 14px 'Inter', sans-serif; color: #0F172A">Remove Checked</button>
          </div>
        </section>
      </div>

      <aside aria-label="List summary" style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 16px">
        <section style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 20px; background: #0F172A; color: #FFFFFF">
          <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #C4B5FD">KNOWN SPEND</span>
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">$42.10</span>
          <div role="progressbar" aria-valuenow="8" aria-valuemin="0" aria-valuemax="12" aria-label="Items checked" style="height: 8px; border-radius: 999px; background: #1D283A; overflow: hidden"><div style="width: 67%; height: 8px; border-radius: 999px; background: #22D3EE"></div></div>
          <dl style="margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 15px">
            <dt style="color: #CBD5E1">In the basket</dt><dd style="margin: 0; font-weight: 600; font-variant-numeric: tabular-nums">$28.30</dd>
            <dt style="color: #CBD5E1">Still to buy</dt><dd style="margin: 0; font-weight: 600; font-variant-numeric: tabular-nums">$13.80</dd>
            <dt style="color: #CBD5E1">Without a price</dt><dd style="margin: 0; font-weight: 600; color: #FCD34D">1 item</dd>
          </dl>
          <span style="font-size: 13px; line-height: 18px; color: #94A3B8">Prices come from your Catalog. Amounts are labels, not multipliers.</span>
        </section>
        <section style="display: flex; flex-direction: column; padding: 8px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <h2 style="margin: 8px 10px 6px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">LIST ACTIONS</h2>
          <button type="button" style="min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; font: 500 15px 'Inter', sans-serif; color: #0F172A">Rename list</button>
          <button type="button" style="min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; font: 500 15px 'Inter', sans-serif; color: #0F172A">Add to multiple lists…</button>
          <span style="height: 1px; margin: 6px 10px; background: #E2E8F0"></span>
          <button type="button" style="min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; font: 600 15px 'Inter', sans-serif; color: #B91C1C">Delete Grocery List…</button>
        </section>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { produce: '#16A34A', dairy: '#0EA5E9', meat: '#DC2626', bakery: '#D97706' };
    const dot = (c) => 'width:8px;height:8px;border-radius:999px;flex-shrink:0;background:' + colors[c];
    const chip = (on) => 'display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;font:500 14px Inter,sans-serif;color:#0F172A;' + (on ? 'border:1px dashed #CBD5E1;background:#F8FAFC;opacity:0.6;cursor:not-allowed' : 'border:1px solid #64748B;background:#FFFFFF');
    const suggest = [
      ['Eggs', 'dairy', '$4.20', false], ['Butter', 'dairy', '$3.80', false], ['Spinach', 'produce', '$3.99', false], ['Oat milk', 'dairy', 'on this list', true], ['Croissants', 'bakery', '$6.00', false]
    ].map(([name, c, price, on]) => ({ name, price, on, cat: c, style: chip(on) }));
    const row = (name, meta, note, unpriced) => ({ name, meta, note: note || '', hasNote: !!note, unpriced: !!unpriced });
    const groups = [
      { key: 'produce', name: 'Produce', rows: [row('Bananas', '1 bunch · $2.50'), row('Avocados', '3 · $4.50', 'ripe ones')] },
      { key: 'dairy', name: 'Dairy', rows: [row('Oat milk', '2 · $5.20', 'barista edition')] },
      { key: 'meat', name: 'Meat', rows: [row('Chicken thighs', '500g', '', true)] }
    ].map((g) => ({ name: g.name, key: g.key, label: g.name.toUpperCase() + ' · ' + g.rows.length, rows: g.rows }));
    return { suggest, groups };
  }
}
</script>
</body>
</html>
