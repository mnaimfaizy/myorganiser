<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#5B21B6}a:hover{color:#4C1D95}
input::placeholder,textarea::placeholder{color:#64748B}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1150px; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="flex: 0 0 272px; display: flex">
    <dc-import name="AppSidebar" active="tasks" min-height="1150" hint-size="272px,1150px"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="AppHeader" title="Tasks" crumb="Dashboard" state="synced" hint-size="100%,76px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
          <dc-import name="Illustration" kind="tasks" size="64" hint-size="64px,64px"></dc-import>
          <span style="display: flex; flex-direction: column; flex-grow: 1">
            <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Tasks</h1>
            <span style="font-size: 15px; line-height: 20px; color: #64748B">{{summary}}</span>
          </span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 14px; border-radius: 12px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 15px 'Inter', sans-serif"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="2" width="2" height="14" rx="1" fill="#FFFFFF"></rect><rect x="2" y="8" width="14" height="2" rx="1" fill="#FFFFFF"></rect></svg>Add task</button>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: #ECEEF0; width: 300px">
            <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 15px 'Inter', sans-serif; color: #0F172A">All</button>
            <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif; color: #0F172A">Personal</button>
            <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif; color: #0F172A">Work</button>
          </div>
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>

        <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="2" width="2" height="14" rx="1" fill="#7C3AED"></rect><rect x="2" y="8" width="14" height="2" rx="1" fill="#7C3AED"></rect></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Quick add a task</span>
          <input placeholder="Quick add — type a task and press Enter" style="flex-grow: 1; min-width: 0; border: 0; outline: none; font: 400 16px 'Inter', sans-serif">
          <span style="display: flex; gap: 6px"><span style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; border: 1px solid #CBD5E1; font-size: 13px; color: #334155">Today</span><span style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; border: 1px solid #CBD5E1; font-size: 13px; color: #334155">High</span></span>
        </label>

        <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
            <section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 8px">
              <h2 style="{{g.headStyle}}">{{g.label}}</h2>
              <div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
                <sc-for list="{{g.rows}}" as="t" hint-placeholder-count="2">
                  <div style="{{t.rowStyle}}">
                    <input type="checkbox" aria-label="Done: {{t.title}}" style="width: 22px; height: 22px; accent-color: #0F172A; flex-shrink: 0">
                    <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
                      <a href="#" style="font-size: 17px; line-height: 24px; color: #0F172A; text-decoration: none">{{t.title}}</a>
                      <sc-if value="{{t.hasDesc}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 18px; color: #64748B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.desc}}</span></sc-if>
                    </span>
                    <span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0">
                      <sc-if value="{{t.hasStatus}}" hint-placeholder-val="{{false}}"><span style="{{t.statusStyle}}">{{t.status}}</span></sc-if>
                      <span style="{{t.prioStyle}}">{{t.prio}}</span>
                      <span style="width: 64px; font-size: 13px; color: #64748B">{{t.context}}</span>
                      <span style="{{t.dueStyle}}">{{t.due}}</span>
                    </span>
                  </div>
                </sc-for>
              </div>
            </section>
          </sc-for>
          <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #E2E8F0; background: #FFFFFF; font: 600 15px 'Inter', sans-serif; color: #0F172A; text-align: left"><svg width="12" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#334155"></path></svg>Done this week · 4</button>
        </sc-if>

        <sc-if value="{{isClear}}" hint-placeholder-val="{{false}}">
          <section style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0; text-align: center">
            <dc-import name="Illustration" kind="tasks" size="112" hint-size="112px,112px"></dc-import>
            <h2 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">All clear</h2>
            <p style="margin: 0; font-size: 17px; line-height: 24px; color: #475569">Nothing open. 4 tasks done this week.</p>
            <div style="display: flex; gap: 10px; margin-top: 6px"><button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif">Show done</button><button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 15px 'Inter', sans-serif">Add task</button></div>
          </section>
        </sc-if>
      </div>

      <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
        <aside aria-label="Task detail" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06)">
          <div style="display: flex; align-items: flex-start; gap: 8px">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
              <label for="td-t" style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">TASK</label>
              <input id="td-t" value="Book dentist appointment" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #CBD5E1; font: 600 17px 'Inter', sans-serif; outline: none">
            </span>
            <button type="button" aria-label="Close detail" style="width: 40px; height: 40px; margin-top: 20px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="1" width="2.2" height="16" rx="1.1" fill="#334155" transform="rotate(45 9 9)"></rect><rect x="8" y="1" width="2.2" height="16" rx="1.1" fill="#334155" transform="rotate(-45 9 9)"></rect></svg></button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 15px; font-weight: 600">Status</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{statuses}}" as="s" hint-placeholder-count="5">
                <button type="button" aria-pressed="{{s.pressed}}" style="{{s.style}}">{{s.label}}</button>
              </sc-for>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Priority</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #ECEEF0"><button type="button" aria-pressed="false" style="height: 34px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">High</button><button type="button" aria-pressed="true" style="height: 34px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 14px 'Inter', sans-serif">Med</button><button type="button" aria-pressed="false" style="height: 34px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">Low</button></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 600">Context</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #ECEEF0"><button type="button" aria-pressed="true" style="height: 34px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 14px 'Inter', sans-serif">Pers.</button><button type="button" aria-pressed="false" style="height: 34px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">Work</button><button type="button" aria-pressed="false" style="height: 34px; border: 0; border-radius: 8px; background: transparent; font: 500 14px 'Inter', sans-serif">None</button></div></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="td-d" style="font-size: 15px; font-weight: 600">Due date</label><input id="td-d" value="Today, 18 Oct" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #64748B; font: 400 15px 'Inter', sans-serif; outline: none"></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="td-e" style="font-size: 15px; font-weight: 600">Estimate</label><input id="td-e" value="15 min" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #64748B; font: 400 15px 'Inter', sans-serif; outline: none"></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="td-n" style="font-size: 15px; font-weight: 600">Description</label><textarea id="td-n" rows="3" style="box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #64748B; font: 400 15px 'Inter', sans-serif; resize: vertical; outline: none">Six-month check-up. Ask about the night guard.</textarea></div>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #115E59"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: #0F766E"></span>Saved · created 3 Oct</span>
          <div style="display: flex; gap: 10px; padding-top: 12px; border-top: 1px solid #E2E8F0">
            <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; font: 600 15px 'Inter', sans-serif">Archive</button>
            <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #FCA5A5; background: #FFFFFF; color: #B91C1C; font: 600 15px 'Inter', sans-serif">Delete…</button>
          </div>
        </aside>
      </sc-if>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["list","allclear"],"default":"list","section":"State"},"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const clear = (this.props.view ?? 'list') === 'allclear';
    const chip = (on) => 'height:36px;padding:0 12px;border-radius:10px;font:500 14px Inter,sans-serif;' + (on ? 'border:1px solid #0F172A;background:#0F172A;color:#FFFFFF' : 'border:1px solid #64748B;background:#FFFFFF;color:#0F172A');
    const chips = [['Open · 12', true], ['In progress · 2', false], ['Blocked · 1', false], ['Done', false], ['Archived', false]].map(([label, on]) => ({ label, pressed: on ? 'true' : 'false', style: chip(on) }));
    const pill = (bg, fg) => 'display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;background:' + bg + ';color:' + fg;
    const prio = { high: ['High', pill('#FEE2E2', '#B91C1C')], medium: ['Med', pill('#F1F5F9', '#334155')], low: ['Low', pill('#F8FAFC', '#64748B')] };
    const status = { in_progress: ['In progress', pill('#EDE9FE', '#5B21B6')], blocked: ['Blocked', pill('#FEF3C7', '#92400E')] };
    const task = (title, desc, p, ctx, due, dueTone, st, selected) => ({
      title, desc: desc || '', hasDesc: !!desc,
      prio: prio[p][0], prioStyle: prio[p][1],
      hasStatus: !!st, status: st ? status[st][0] : '', statusStyle: st ? status[st][1] : '',
      context: ctx, due,
      dueStyle: 'width:84px;text-align:right;font-size:13px;font-weight:' + (dueTone ? 600 : 400) + ';color:' + (dueTone === 'over' ? '#B91C1C' : dueTone === 'today' ? '#92400E' : '#64748B'),
      rowStyle: 'display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-bottom:1px solid #F1F5F9;' + (selected ? 'background:#F5F3FF;box-shadow:inset 0 0 0 2px #C4B5FD' : '')
    });
    const head = (c) => 'margin:0;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.02em;color:' + c;
    const groups = [
      { name: 'Overdue', label: 'OVERDUE · 1', headStyle: head('#B91C1C'), rows: [task('Pay council tax', 'Quarter 3 instalment', 'high', 'Personal', 'Yesterday', 'over')] },
      { name: 'Today', label: 'TODAY · 3', headStyle: head('#92400E'), rows: [
        task('Book dentist appointment', 'Six-month check-up. Ask about the night guard.', 'medium', 'Personal', 'Today', 'today', null, true),
        task('Send rent receipt', '', 'medium', 'Personal', 'Today', 'today'),
        task('Review Q4 budget draft', 'Comments due before Monday stand-up', 'high', 'Work', 'Today', 'today', 'in_progress')
      ] },
      { name: 'Upcoming', label: 'UPCOMING · 3', headStyle: head('#475569'), rows: [
        task('Renew passport', 'Photos first', 'high', 'Personal', 'Fri 24 Oct', null, 'blocked'),
        task('Plan team offsite', '', 'medium', 'Work', 'Mon 27 Oct'),
        task('Clean gutters', '', 'low', 'Personal', 'Sat 1 Nov')
      ] },
      { name: 'No date', label: 'NO DATE · 2', headStyle: head('#475569'), rows: [
        task('Read “Deep Work”', '', 'low', 'Personal', '—'),
        task('Update CV', 'Add the migration project', 'medium', 'Work', '—')
      ] }
    ];
    const sb = (on) => 'height:36px;padding:0 12px;border-radius:10px;font:500 14px Inter,sans-serif;' + (on ? 'border:1px solid #0F172A;background:#0F172A;color:#FFFFFF' : 'border:1px solid #CBD5E1;background:#FFFFFF;color:#0F172A');
    const statuses = [['Pending', true], ['In progress', false], ['Blocked', false], ['Done', false], ['Cancelled', false]].map(([label, on]) => ({ label, pressed: on ? 'true' : 'false', style: sb(on) }));
    return {
      isList: !clear, isClear: clear,
      summary: clear ? 'Nothing open · 4 done this week' : '12 open · 3 due today · 1 overdue',
      chips, groups, statuses
    };
  }
}
</script>
</body>
</html>
