<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Shorts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1000px; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="flex: 0 0 272px; display: flex">
    <dc-import name="AppSidebar" active="youtube" min-height="1000" hint-size="272px,1000px"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="AppHeader" title="Shorts" crumb="YouTube" state="synced" hint-size="100%,76px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 20px">
      <div role="tablist" aria-label="YouTube" style="display: flex; gap: 24px; border-bottom: 1px solid #E2E8F0">
        <a href="#" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; height: 44px; border-bottom: 3px solid transparent; font-size: 15px; font-weight: 500; color: #475569; text-decoration: none">Videos</a>
        <a href="#" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; height: 44px; border-bottom: 3px solid #7C3AED; font-size: 15px; font-weight: 600; color: #0F172A; text-decoration: none">Shorts</a>
        <a href="#" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; height: 44px; border-bottom: 3px solid transparent; font-size: 15px; font-weight: 500; color: #475569; text-decoration: none">Channels · 12</a>
      </div>

      <section aria-label="Shorts daily budget" style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 16px 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0">
        <span style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 320px">
          <span style="display: flex; justify-content: space-between; font-size: 15px"><span><b style="font-variant-numeric: tabular-nums">18 of 30 min</b> <span style="color: #64748B">used today</span></span><span style="font-weight: 600; color: #92400E">12 min left</span></span>
          <span role="progressbar" aria-valuenow="18" aria-valuemin="0" aria-valuemax="30" aria-label="Shorts budget used" style="display: block; height: 8px; border-radius: 999px; background: #ECEEF0; overflow: hidden"><span style="display: block; width: 60%; height: 8px; border-radius: 999px; background: #F97316"></span></span>
          <span style="font-size: 13px; color: #64748B">Resets at midnight. Long videos have no limit.</span>
        </span>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 15px; font-weight: 600">Daily limit</span>
          <div style="display: flex; align-items: center; border: 1px solid #64748B; border-radius: 12px; overflow: hidden">
            <button type="button" aria-label="Five minutes less" style="width: 44px; height: 42px; border: 0; background: #FFFFFF; font: 600 18px 'Inter', sans-serif">−</button>
            <span style="min-width: 64px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">30 min</span>
            <button type="button" aria-label="Five minutes more" style="width: 44px; height: 42px; border: 0; background: #FFFFFF; font: 600 18px 'Inter', sans-serif">+</button>
          </div>
        </div>
      </section>

      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; justify-content: center">
        <div style="display: flex; align-items: center; gap: 16px">
          <button type="button" aria-label="Previous Short" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #CBD5E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9.5 1.5 L4 7 L9.5 12.5 L10.9 11.1 L6.8 7 L10.9 2.9 Z" fill="#334155"></path></svg></button>
          <div style="display: flex; flex-direction: column; gap: 12px; width: 340px">
            <div style="position: relative; width: 340px; height: 604px; border-radius: 24px; background: #0F172A; display: flex; align-items: center; justify-content: center">
              <button type="button" aria-label="Play" style="width: 64px; height: 64px; border-radius: 999px; border: 0; background: #F97316; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5 L11.5 7 L4 11.5 Z" fill="#FFFFFF"></path></svg></button>
              <span style="position: absolute; top: 14px; left: 14px; padding: 4px 10px; border-radius: 999px; background: rgba(15, 23, 42, 0.7); color: #FFFFFF; font-size: 12px; font-weight: 600">0:48</span>
              <span style="position: absolute; top: 14px; right: 14px; padding: 4px 10px; border-radius: 999px; background: rgba(15, 23, 42, 0.7); color: #FFFFFF; font-size: 12px; font-weight: 600">4 of 16</span>
            </div>
            <span style="display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 24px; font-weight: 600">One-minute knife skills</span><span style="font-size: 13px; color: #64748B">Home Kitchen · today</span></span>
            <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 15px 'Inter', sans-serif; color: #0F172A">Mark watched</button>
          </div>
          <button type="button" aria-label="Next Short" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid #CBD5E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4.5 1.5 L10 7 L4.5 12.5 L3.1 11.1 L7.2 7 L3.1 2.9 Z" fill="#334155"></path></svg></button>
        </div>
        <aside aria-label="All Shorts" style="flex: 0 1 300px; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0">
          <h2 style="margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #64748B">UP NEXT · 12</h2>
          <sc-for list="{{shorts}}" as="s" hint-placeholder-count="5">
            <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; text-decoration: none; color: #0F172A">
              <span aria-hidden="true" style="width: 40px; height: 70px; border-radius: 8px; background: #1D283A; flex-shrink: 0"></span>
              <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 14px; line-height: 18px; font-weight: 600">{{s.title}}</span><span style="font-size: 12px; color: #64748B">{{s.meta}}</span></span>
            </a>
          </sc-for>
        </aside>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      shorts: [
        { title: 'Two-ingredient flatbread', meta: 'Home Kitchen · 0:58 · new' },
        { title: 'Fixing a squeaky hinge', meta: 'Maker Studio · 0:41 · new' },
        { title: 'Planting garlic in autumn', meta: 'Plot to Plate · 0:55' },
        { title: 'Why ice floats', meta: 'Science Weekly · 0:37' },
        { title: 'Quick pickled onions', meta: 'Home Kitchen · 0:49' }
      ]
    };
  }
}
</script>
</body>
</html>
