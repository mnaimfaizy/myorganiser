<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Grocery Lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <main style="flex-grow: 1; overflow: hidden; box-sizing: border-box; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: flex-end; height: 44px; align-items: center; margin-right: -8px">
      <button type="button" aria-label="Lock vault" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="10" width="14" height="10" rx="2.5" fill="#7C3AED"></rect><path d="M7 10 V7.5 C7 5 8.8 3 11 3 C13.2 3 15 5 15 7.5 V10 H13 V7.5 C13 6.1 12.1 5 11 5 C9.9 5 9 6.1 9 7.5 V10 Z" fill="#7C3AED"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Illustration" kind="groceries" size="44" hint-size="44px,44px"></dc-import>
      <span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Groceries</h1><span style="font-size: 13px; line-height: 18px; color: #64748B">4 lists · $86.40 known</span></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 4px; border-radius: 12px; background: #ECEEF0">
      <button type="button" aria-pressed="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12); font: 600 15px 'Inter', sans-serif; color: #0F172A">Lists</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font: 500 15px 'Inter', sans-serif; color: #0F172A">Catalog · 42</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{lists}}" as="l" hint-placeholder-count="4">
        <a href="{{l.href}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E8F0; text-decoration: none; color: #0F172A">
          <span style="display: flex; align-items: center; gap: 10px">
            <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; line-height: 22px; font-weight: 700">{{l.name}}</span><span style="font-size: 13px; line-height: 18px; color: #64748B">{{l.sub}}</span></span>
            <span style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{l.amount}}</span>
            <svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#94A3B8"></path></svg>
          </span>
          <sc-if value="{{l.hasBar}}" hint-placeholder-val="{{true}}">
            <span role="progressbar" aria-valuenow="{{l.done}}" aria-valuemin="0" aria-valuemax="{{l.total}}" aria-label="{{l.name}} progress" style="display: block; height: 6px; border-radius: 999px; background: #ECEEF0; overflow: hidden"><span style="{{l.bar}}"></span></span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </main>
  <button type="button" style="position: absolute; right: 16px; bottom: 104px; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 16px; border-radius: 18px; border: 0; background: #7C3AED; box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35); color: #FFFFFF; font: 600 15px 'Inter', sans-serif"><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><rect x="9.75" y="2" width="2.5" height="18" rx="1.25" fill="#FFFFFF"></rect><rect x="2" y="9.75" width="18" height="2.5" rx="1.25" fill="#FFFFFF"></rect></svg>New list</button>
  <dc-import name="TabBar" active="groceries" hint-size="390px,88px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (name, done, total, amount, sub, href) => {
      const pct = total ? Math.round((done / total) * 100) : 0;
      return {
        name, done, total, amount, href,
        sub: total === 0 ? 'Nothing on it yet' : sub,
        hasBar: total > 0,
        bar: 'display:block;height:6px;border-radius:999px;width:' + pct + '%;background:' + (done === total ? '#15803D' : '#7C3AED')
      };
    };
    const lists = [
      mk('Weekly shop', 8, 12, '$42.10', '8 of 12 checked · 2 h ago', 'GroceryListPhone.dc.html'),
      mk('Costco run', 3, 20, '$31.80', '3 of 20 · 2 unpriced', '#'),
      mk('Party supplies', 0, 0, '$0.00', '', 'GroceryListEmptyPhone.dc.html'),
      mk('Office snacks', 5, 5, '$12.50', 'All bought · Uncheck All to reuse', '#')
    ];
    return { lists };
  }
}
</script>
</body>
</html>
