<script type="text/x-dc" data-dc-script data-props='{"category":{"editor":"enum","options":["produce","dairy","meat","seafood","bakery","frozen","beverages","snacks","condiments","household","personal-care","other"],"default":"produce"},"size":{"editor":"int","min":16,"max":160,"default":64},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const known = ['produce', 'dairy', 'meat', 'seafood', 'bakery', 'frozen', 'beverages', 'snacks', 'condiments', 'household', 'personal-care', 'other'];
    let c = this.props.category ?? 'produce';
    if (known.indexOf(c) < 0) c = 'other';
    const size = Number(this.props.size ?? 64) || 64;
    return {
      size,
      px: size + 'px',
      is: {
        produce: c === 'produce', dairy: c === 'dairy', meat: c === 'meat', seafood: c === 'seafood',
        bakery: c === 'bakery', frozen: c === 'frozen', beverages: c === 'beverages', snacks: c === 'snacks',
        condiments: c === 'condiments', household: c === 'household', personal: c === 'personal-care', other: c === 'other'
      }
    };
  }
}
</script>
