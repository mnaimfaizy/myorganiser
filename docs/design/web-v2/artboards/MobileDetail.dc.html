<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile number detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1100px; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="flex: 0 0 272px; display: flex">
    <dc-import name="AppSidebar" active="mobile" min-height="1100" hint-size="272px,1100px"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="AppHeader" title="Personal" crumb="Mobile numbers" state="synced" hint-size="100%,76px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1200px; margin: 0 auto; padding: 32px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 20px; background: #0F172A; color: #FFFFFF">
        <div style="display: flex; align-items: center; gap: 14px">
          <dc-import name="Illustration" kind="mobile" size="56" hint-size="56px,56px"></dc-import>
          <span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Personal</h1><span style="font-size: 13px; color: #94A3B8">Australia · updated 3 Oct</span></span>
        </div>
        <button type="button" aria-label="Copy number +61 412 345 678" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; padding: 0 12px 0 18px; border-radius: 16px; border: 1px solid #334155; background: #1D283A; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: left">+61 412 345 678
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #334155; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="5" y="5" width="10" height="11" rx="2" fill="#FFFFFF"></rect><rect x="2" y="2" width="10" height="11" rx="2" fill="#94A3B8"></rect></svg></span>
        </button>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <a href="#" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #7C3AED; color: #FFFFFF; font: 600 15px 'Inter', sans-serif; text-decoration: none">Call</a>
          <a href="#" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; border: 1px solid #475569; color: #FFFFFF; font: 600 15px 'Inter', sans-serif; text-decoration: none">Message</a>
          <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid #475569; background: transparent; color: #FFFFFF; font: 600 15px 'Inter', sans-serif">Edit</button>
        </div>
      </section>

      <section aria-labelledby="mplaces" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-bottom: 1px solid #E2E8F0">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="display: flex; flex-direction: column; flex-grow: 1"><h2 id="mplaces" style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700">Places to update</h2><span style="font-size: 13px; color: #64748B">Everyone who has this number on file</span></span>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 10px; border: 0; background: #7C3AED; color: #FFFFFF; font: 600 14px 'Inter', sans-serif"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="2" width="2" height="14" rx="1" fill="#FFFFFF"></rect><rect x="2" y="8" width="14" height="2" rx="1" fill="#FFFFFF"></rect></svg>Add place</button>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 15px"><span><b>1 of 2</b> <span style="color: #64748B">updated</span></span><span style="font-size: 13px; color: #92400E; font-weight: 600">1 to go</span></div>
          <div role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="2" aria-label="Places updated" style="height: 8px; border-radius: 999px; background: #ECEEF0; overflow: hidden"><div style="width: 50%; height: 8px; border-radius: 999px; background: #7C3AED"></div></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 12px 0 20px; border-bottom: 1px solid #F1F5F9">
          <input type="checkbox" aria-label="Updated at Bank" style="width: 22px; height: 22px; accent-color: #15803D">
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; line-height: 24px">Bank</span><span style="font-size: 13px; color: #64748B">Finance · phone</span></span>
          <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: #FEE2E2; color: #B91C1C; font-size: 11px; font-weight: 600">HIGH</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 12px 0 20px; background: #FCFCFD">
          <input type="checkbox" checked="{{true}}" aria-label="Updated at Doctor's clinic" style="width: 22px; height: 22px; accent-color: #15803D">
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; line-height: 24px; color: #64748B">Doctor's clinic</span><span style="font-size: 13px; color: #64748B">Health · in person · updated 1 Oct</span></span>
          <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: #DCFCE7; color: #166534; font-size: 11px; font-weight: 600">UPDATED</span>
        </div>
      </section>

      <section style="flex: 1 1 340px; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
        <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 600">Delete this number</span><span style="font-size: 13px; line-height: 18px; color: #64748B">Its 2 places go with it, on every device.</span></span>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #FCA5A5; background: #FFFFFF; color: #B91C1C; font: 600 14px 'Inter', sans-serif">Delete…</button>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
