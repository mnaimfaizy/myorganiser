<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone your reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 24px">
    <a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; font-size: 17px; text-decoration: none"><svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M6.6 0 L8 1.4 L3.4 6 L8 10.6 L6.6 12 L0.6 6 Z" fill="#5B21B6"></path></svg>Account</a>
    <div style="display: flex; align-items: center; gap: 12px">
      <dc-import name="Illustration" kind="feedback" size="44" hint-size="44px,44px"></dc-import>
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em">Your reports</h1>
      <button type="button" aria-label="Send feedback" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #7C3AED; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="8" y="2" width="2.4" height="14" rx="1.2" fill="#FFFFFF"></rect><rect x="2" y="8" width="14" height="2.4" rx="1.2" fill="#FFFFFF"></rect></svg></button>
    </div>
    <sc-for list="{{reports}}" as="r" hint-placeholder-count="5">
      <article style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0">
        <span style="display: flex; align-items: center; gap: 8px"><span style="{{r.badge}}">{{r.status}}</span><span style="font-size: 13px; color: #64748B">{{r.kind}} · {{r.date}}</span></span>
        <h2 style="margin: 0; font-size: 16px; line-height: 21px; font-weight: 600">{{r.title}}</h2>
        <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #F8FAFC; font-size: 14px; line-height: 20px; color: #475569">{{r.note}}</p></sc-if>
        <sc-if value="{{r.canFollowUp}}" hint-placeholder-val="{{false}}">
          <form style="display: flex; flex-direction: column; gap: 6px">
            <label for="yrp-fu" style="font-size: 15px; font-weight: 600">Follow-up</label>
            <textarea id="yrp-fu" rows="3" placeholder="Add more detail…" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #CBD5E1; font: 400 16px 'Inter', sans-serif; resize: none"></textarea>
            <button type="submit" style="height: 48px; border-radius: 12px; border: 0; background: #0F172A; color: #FFFFFF; font: 600 16px 'Inter', sans-serif">Send follow-up</button>
          </form>
        </sc-if>
        <sc-if value="{{r.hasRelease}}" hint-placeholder-val="{{false}}"><a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none">{{r.release}} → View CHANGELOG ↗</a></sc-if>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (bg, fg, border) => 'flex-shrink:0;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:' + bg + ';color:' + fg + (border ? ';border:1px solid ' + border : '');
    const S = { 'Under review': pill('#E0F2FE', '#075985'), 'Planned': pill('#EDE9FE', '#5B21B6'), 'Fixed': pill('#CCFBF1', '#115E59'), "Won't do": pill('#FEE2E2', '#B91C1C'), "Can't reproduce": pill('#FFFFFF', '#92400E', '#FCD34D') };
    const r = (o) => ({ note: '', release: '', ...o, badge: S[o.status], hasNote: !!o.note, hasRelease: !!o.release, canFollowUp: !!o.canFollowUp });
    const reports = [
      r({ title: 'Uncheck All skips the last item', kind: 'Bug report', status: "Can't reproduce", note: 'Which list size and browser were you using?', canFollowUp: true, date: 'Oct 18, 2026' }),
      r({ title: 'Renewal date shows a day early', kind: 'Bug report', status: 'Fixed', release: 'Fixed in v2.1.0', date: 'Oct 2, 2026' }),
      r({ title: 'Share a Grocery List with family', kind: 'Suggestion', status: 'Planned', date: 'Sep 28, 2026' }),
      r({ title: 'Task reminders arrive twice', kind: 'Bug report', status: 'Under review', date: 'Sep 20, 2026' })
    ];
    return { reports };
  }
}
</script>
</body>
</html>
