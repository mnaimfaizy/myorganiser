<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone address detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B21B6}a:hover{color:#4C1D95}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
    <a href="AddressesPhone.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; text-decoration: none; color: #5B21B6; font-size: 17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 3.5 L6.5 11 L14 18.5 L15.6 16.9 L9.7 11 L15.6 5.1 Z" fill="#5B21B6"></path></svg>Addresses</a>
    <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B21B6; font: 700 17px 'Inter', sans-serif">Edit</button>
  </div>
  <main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="display: flex; align-items: center; gap: 10px"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Home</h1><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: #CCFBF1; color: #115E59; font-size: 12px; font-weight: 600">CURRENT</span></span>
      <span style="font-size: 13px; color: #64748B">Tap a line to copy it</span>
    </div>
    <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
        <button type="button" aria-label="Copy {{f.label}}: {{f.value}}" style="display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 0 6px 0 16px; border: 0; border-bottom: 1px solid #F1F5F9; background: #FFFFFF; text-align: left; font-family: 'Inter', sans-serif">
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 13px; line-height: 18px; color: #64748B">{{f.label}}</span><span style="font-size: 18px; line-height: 24px; font-weight: 500; color: #0F172A">{{f.value}}</span></span>
          <span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="5" y="5" width="10" height="11" rx="2" fill="#334155"></rect><rect x="2" y="2" width="10" height="11" rx="2" fill="#94A3B8"></rect></svg></span>
        </button>
      </sc-for>
    </div>
    <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 15px 'Inter', sans-serif; color: #0F172A">Copy all</button>
      <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #ECEEF0; font: 600 15px 'Inter', sans-serif; color: #0F172A">Open in Maps</button>
    </div>

    <section aria-labelledby="ph-places" style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px">
      <div style="padding: 0 16px; display: flex; align-items: flex-end; justify-content: space-between">
        <h2 id="ph-places" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #475569">PLACES TO UPDATE · 3 OF 5</h2>
        <a href="UsageLocationPhone.dc.html" style="font-size: 15px; font-weight: 700; text-decoration: none">Add</a>
      </div>
      <div role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="5" aria-label="Places updated" style="margin: 0 16px; height: 6px; border-radius: 999px; background: #ECEEF0; overflow: hidden"><div style="width: 60%; height: 6px; border-radius: 999px; background: #7C3AED"></div></div>
      <div style="margin: 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px; border-bottom: 1px solid #F1F5F9"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #15803D"><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; line-height: 24px">Bank</span><span style="font-size: 13px; color: #64748B">In person</span></span><span style="padding: 2px 8px; border-radius: 999px; background: #FEE2E2; color: #B91C1C; font-size: 11px; font-weight: 600">HIGH</span></label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #15803D"><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 17px; line-height: 24px">Electoral roll</span><span style="font-size: 13px; color: #64748B">Online · link saved</span></span><span style="padding: 2px 8px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 600">MEDIUM</span></label>
      </div>
      <button type="button" aria-expanded="false" style="margin: 0 16px; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid #E2E8F0; background: #FFFFFF; font: 600 15px 'Inter', sans-serif; color: #0F172A; text-align: left"><svg width="12" height="12" viewBox="0 0 8 12" aria-hidden="true"><path d="M1.4 0 L7.4 6 L1.4 12 L0 10.6 L4.6 6 L0 1.4 Z" fill="#334155"></path></svg>Updated · 3</button>
    </section>
  </main>
  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 12px; background: #0F172A; color: #FFFFFF; font-size: 15px"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.2 L6.2 11.8 L13.5 4.4 L12.1 3 L6.2 9 L3.9 6.8 Z" fill="#22D3EE"></path></svg>Street copied — clears in 60 s</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { fields: [['Street', '14 Rose Lane'], ['Suburb', 'Richmond VIC 3121'], ['Country', 'Australia']].map(([label, value]) => ({ label, value })) };
  }
}
</script>
</body>
</html>
