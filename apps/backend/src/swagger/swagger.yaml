openapi: 3.0.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    VersionFloorRefusal:
      description: "HTTP 426: the Mobile App is below this environment's Version Floor."
      properties:
        code:
          type: string
          enum:
            - below_version_floor
          nullable: false
        message:
          type: string
          description: "Short and User-safe: tells the User to update the Mobile App."
        versionFloor:
          type: string
          description: The configured floor as written.
        platform:
          type: string
          enum:
            - android
            - ios
            - null
          nullable: true
          description: From the X-Client header; null when it could not be read.
      required:
        - code
        - message
        - versionFloor
        - platform
      type: object
      additionalProperties: false
    YouTubeAcknowledgementResponse:
      properties:
        acknowledgedAt:
          type: string
          nullable: true
          description: ISO time the User accepted the one-time acknowledgement, or null
            (ADR 0129).
      required:
        - acknowledgedAt
      type: object
      additionalProperties: false
    YouTubeErrorResponse:
      properties:
        message:
          type: string
      required:
        - message
      type: object
    AuthUrlResponse:
      properties:
        url:
          type: string
      required:
        - url
      type: object
      additionalProperties: false
    AcknowledgementRequiredResponse:
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - acknowledgement_required
          nullable: false
      required:
        - message
        - code
      type: object
      additionalProperties: false
    StatusResponse:
      properties:
        connected:
          type: boolean
        status:
          type: string
      required:
        - connected
        - status
      type: object
      additionalProperties: false
    DisconnectResponse:
      anyOf:
        - properties:
            googlePermissionsUrl:
              type: string
            revokeFailed:
              type: boolean
            message:
              type: string
            ok:
              type: boolean
              enum:
                - true
              nullable: false
          required:
            - message
            - ok
          type: object
        - properties:
            code:
              type: string
              enum:
                - sync_run_live
              nullable: false
            message:
              type: string
            ok:
              type: boolean
              enum:
                - false
              nullable: false
          required:
            - message
            - ok
          type: object
    SubscriptionResponse:
      properties:
        id:
          type: string
        channelId:
          type: string
        channelTitle:
          type: string
        channelThumbnail:
          type: string
          nullable: true
        uploadsPlaylistId:
          type: string
        enabled:
          type: boolean
        lastSyncedAt:
          type: string
          nullable: true
      required:
        - id
        - channelId
        - channelTitle
        - channelThumbnail
        - uploadsPlaylistId
        - enabled
        - lastSyncedAt
      type: object
      additionalProperties: false
    ChannelSyncResponse:
      properties:
        synced:
          type: number
          format: double
        status:
          type: string
        lastAttemptAt:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        retryAt:
          type: string
          nullable: true
      required:
        - synced
        - status
        - lastAttemptAt
        - lastError
        - retryAt
      type: object
      additionalProperties: false
    ProgressResponse:
      properties:
        total:
          type: number
          format: double
        processed:
          type: number
          format: double
        succeeded:
          type: number
          format: double
        failed:
          type: number
          format: double
        startedAt:
          type: string
        failedChannels:
          items:
            properties:
              error:
                type: string
              channelTitle:
                type: string
              channelId:
                type: string
            required:
              - error
              - channelTitle
              - channelId
            type: object
          type: array
      required:
        - total
        - processed
        - succeeded
        - failed
        - startedAt
        - failedChannels
      type: object
      additionalProperties: false
    SyncResponse:
      properties:
        status:
          type: string
        lastSyncedAt:
          type: string
          nullable: true
        lastSyncAttemptAt:
          type: string
          nullable: true
        lastSyncError:
          type: string
          nullable: true
        retryAt:
          type: string
          nullable: true
        progress:
          allOf:
            - $ref: "#/components/schemas/ProgressResponse"
          nullable: true
        channelStatus:
          type: string
        channelLastAttemptAt:
          type: string
          nullable: true
        channelLastError:
          type: string
          nullable: true
        channelRetryAt:
          type: string
          nullable: true
        synced:
          type: number
          format: double
        videosSynced:
          type: number
          format: double
      required:
        - status
        - lastSyncedAt
        - lastSyncAttemptAt
        - lastSyncError
        - retryAt
        - progress
        - channelStatus
        - channelLastAttemptAt
        - channelLastError
        - channelRetryAt
        - synced
        - videosSynced
      type: object
      additionalProperties: false
    SyncStatusResponse:
      properties:
        status:
          type: string
        lastSyncedAt:
          type: string
          nullable: true
        lastSyncAttemptAt:
          type: string
          nullable: true
        lastSyncError:
          type: string
          nullable: true
        retryAt:
          type: string
          nullable: true
        progress:
          allOf:
            - $ref: "#/components/schemas/ProgressResponse"
          nullable: true
        channelStatus:
          type: string
        channelLastAttemptAt:
          type: string
          nullable: true
        channelLastError:
          type: string
          nullable: true
        channelRetryAt:
          type: string
          nullable: true
      required:
        - status
        - lastSyncedAt
        - lastSyncAttemptAt
        - lastSyncError
        - retryAt
        - progress
        - channelStatus
        - channelLastAttemptAt
        - channelLastError
        - channelRetryAt
      type: object
      additionalProperties: false
    VideoResponse:
      properties:
        id:
          type: string
        videoId:
          type: string
        channelId:
          type: string
        title:
          type: string
        thumbnail:
          type: string
          nullable: true
        publishedAt:
          type: string
        watched:
          type: boolean
        channelTitle:
          type: string
        durationSeconds:
          type: number
          format: double
          nullable: true
          description: Runtime in seconds, or null when this upload has not been
            classified yet.
        isShort:
          type: boolean
          description: Whether this Cached Upload is a Short. Unclassified uploads are
            never Shorts.
      required:
        - id
        - videoId
        - channelId
        - title
        - thumbnail
        - publishedAt
        - watched
        - durationSeconds
        - isShort
      type: object
      additionalProperties: false
    VideosPageResponse:
      properties:
        videos:
          items:
            $ref: "#/components/schemas/VideoResponse"
          type: array
        total:
          type: number
          format: double
        page:
          type: number
          format: double
        limit:
          type: number
          format: double
        totalPages:
          type: number
          format: double
      required:
        - videos
        - total
        - page
        - limit
        - totalPages
      type: object
      additionalProperties: false
    WatchedResponse:
      properties:
        ok:
          type: boolean
        watched:
          type: boolean
      required:
        - ok
        - watched
      type: object
      additionalProperties: false
    WatchedBody:
      properties:
        watched:
          type: boolean
      required:
        - watched
      type: object
      additionalProperties: false
    ChannelCarouselResponse:
      properties:
        channelId:
          type: string
        channelTitle:
          type: string
        channelThumbnail:
          type: string
          nullable: true
        videos:
          items:
            $ref: "#/components/schemas/VideoResponse"
          type: array
      required:
        - channelId
        - channelTitle
        - channelThumbnail
        - videos
      type: object
      additionalProperties: false
    NotificationSettingsResponse:
      properties:
        enabled:
          type: boolean
          description: Whether the User has opted in to the weekly New-only digest.
        lastNotifiedAt:
          type: string
          nullable: true
        preferredWeekday:
          type: number
          format: double
          description: Preferred send day in the User's own week, 0 = Sunday .. 6 =
            Saturday.
        timeZone:
          type: string
          nullable: true
          description: IANA time zone the weekday is evaluated in. Null means UTC.
      required:
        - enabled
        - lastNotifiedAt
        - preferredWeekday
        - timeZone
      type: object
      additionalProperties: false
    NotificationSettingsBody:
      properties:
        enabled:
          type: boolean
        preferredWeekday:
          type: number
          format: double
        timeZone:
          type: string
          nullable: true
      type: object
      additionalProperties: false
    YouTubeAccessResponse:
      properties:
        granted:
          type: boolean
          description: Whether a Platform Admin has granted the signed-in User YouTube
            Access (ADR 0129).
      required:
        - granted
      type: object
      additionalProperties: false
    YouTubeAvailabilityResponse:
      properties:
        available:
          type: boolean
      required:
        - available
      type: object
      additionalProperties: false
    UnsubscribeResponse:
      properties:
        ok:
          type: boolean
      required:
        - ok
      type: object
      additionalProperties: false
    UnsubscribeBody:
      properties:
        token:
          type: string
      required:
        - token
      type: object
      additionalProperties: false
    CronSyncResponse:
      description: Result of one bounded pass of the metadata sync worker.
      properties:
        ran:
          type: boolean
        processed:
          type: number
          format: double
        usersSynced:
          type: number
          format: double
        failed:
          type: number
          format: double
        done:
          type: boolean
      required:
        - ran
        - processed
        - usersSynced
        - failed
        - done
      type: object
      additionalProperties: false
    CronDigestResponse:
      description: Result of one bounded pass of the weekly digest worker.
      properties:
        ran:
          type: boolean
        processed:
          type: number
          format: double
        sent:
          type: number
          format: double
        skippedEmpty:
          type: number
          format: double
        notDue:
          type: number
          format: double
        duplicates:
          type: number
          format: double
        failed:
          type: number
          format: double
        done:
          type: boolean
      required:
        - ran
        - processed
        - sent
        - skippedEmpty
        - notDue
        - duplicates
        - failed
        - done
      type: object
      additionalProperties: false
    Record_string.unknown_:
      properties: {}
      additionalProperties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    VaultMetaV1:
      properties:
        version:
          type: number
          format: double
        kdf_name:
          type: string
        kdf_salt:
          type: string
        kdf_params:
          $ref: "#/components/schemas/Record_string.unknown_"
        wrapped_mk_passphrase: {}
        wrapped_mk_recovery: {}
      required:
        - version
        - kdf_name
        - kdf_salt
        - kdf_params
        - wrapped_mk_passphrase
        - wrapped_mk_recovery
      type: object
      additionalProperties: {}
    ErrorResponse:
      properties:
        message:
          type: string
        details: {}
      required:
        - message
      type: object
      additionalProperties: false
    GetVaultMetaResponse:
      anyOf:
        - properties:
            etag:
              type: string
            updatedAt:
              type: string
            meta:
              $ref: "#/components/schemas/VaultMetaV1"
          required:
            - etag
            - updatedAt
            - meta
          type: object
        - $ref: "#/components/schemas/ErrorResponse"
    PutVaultMetaResponse:
      anyOf:
        - properties:
            updatedAt:
              type: string
            etag:
              type: string
            ok:
              type: boolean
              enum:
                - true
              nullable: false
          required:
            - updatedAt
            - etag
            - ok
          type: object
        - $ref: "#/components/schemas/ErrorResponse"
    VaultBlobType:
      type: string
      enum:
        - addresses
        - groceries
        - mobileNumbers
        - subscriptions
        - tasks
    EncryptedBlobV1:
      properties:
        version:
          type: number
          format: double
        iv:
          type: string
        ciphertext:
          type: string
      required:
        - version
        - iv
        - ciphertext
      type: object
      additionalProperties: {}
    GetVaultBlobResponse:
      anyOf:
        - properties:
            etag:
              type: string
            updatedAt:
              type: string
            blob:
              $ref: "#/components/schemas/EncryptedBlobV1"
            type:
              $ref: "#/components/schemas/VaultBlobType"
          required:
            - etag
            - updatedAt
            - blob
            - type
          type: object
        - $ref: "#/components/schemas/ErrorResponse"
    GetVaultBlobInventoryResponse:
      anyOf:
        - properties:
            etag:
              type: string
            blobs:
              items:
                properties:
                  updatedAt:
                    type: string
                  etag:
                    type: string
                  type:
                    $ref: "#/components/schemas/VaultBlobType"
                required:
                  - updatedAt
                  - etag
                  - type
                type: object
              type: array
          required:
            - etag
            - blobs
          type: object
        - $ref: "#/components/schemas/ErrorResponse"
    PutVaultBlobResponse:
      anyOf:
        - properties:
            updatedAt:
              type: string
            etag:
              type: string
            ok:
              type: boolean
              enum:
                - true
              nullable: false
          required:
            - updatedAt
            - etag
            - ok
          type: object
        - $ref: "#/components/schemas/ErrorResponse"
    Partial_Record_VaultBlobType.EncryptedBlobV1__:
      properties:
        addresses:
          $ref: "#/components/schemas/EncryptedBlobV1"
        groceries:
          $ref: "#/components/schemas/EncryptedBlobV1"
        mobileNumbers:
          $ref: "#/components/schemas/EncryptedBlobV1"
        subscriptions:
          $ref: "#/components/schemas/EncryptedBlobV1"
        tasks:
          $ref: "#/components/schemas/EncryptedBlobV1"
      type: object
      description: Make all properties in T optional
    VaultExportV1:
      properties:
        exportVersion:
          type: number
          enum:
            - 1
          nullable: false
        exportedAt:
          type: string
        meta:
          $ref: "#/components/schemas/VaultMetaV1"
        blobs:
          $ref: "#/components/schemas/Partial_Record_VaultBlobType.EncryptedBlobV1__"
      required:
        - exportVersion
        - exportedAt
        - meta
        - blobs
      type: object
      additionalProperties: false
    ExportVaultResponse:
      anyOf:
        - $ref: "#/components/schemas/VaultExportV1"
        - $ref: "#/components/schemas/ErrorResponse"
    ImportVaultResponse:
      anyOf:
        - properties:
            ok:
              type: boolean
              enum:
                - true
              nullable: false
          required:
            - ok
          type: object
        - $ref: "#/components/schemas/ErrorResponse"
    VaultBackupEvent:
      type: string
      enum:
        - export
        - import
    VaultBackupSource:
      type: string
      enum:
        - local-file
        - google-drive
    VaultBackupStatus:
      type: string
      enum:
        - success
        - failed
    VaultBackupBlobType:
      type: string
      enum:
        - addresses
        - groceries
        - mobileNumbers
        - subscriptions
        - tasks
    VaultBackupRecordDto:
      properties:
        id:
          type: string
        userId:
          type: string
        event:
          $ref: "#/components/schemas/VaultBackupEvent"
        source:
          $ref: "#/components/schemas/VaultBackupSource"
        status:
          $ref: "#/components/schemas/VaultBackupStatus"
        errorCode:
          type: string
          nullable: true
        schemaVersion:
          type: number
          format: double
        blobTypes:
          items:
            $ref: "#/components/schemas/VaultBackupBlobType"
          type: array
        sizeBytes:
          type: number
          format: double
        createdAt:
          type: string
      required:
        - id
        - userId
        - event
        - source
        - status
        - errorCode
        - schemaVersion
        - blobTypes
        - sizeBytes
        - createdAt
      type: object
      additionalProperties: false
    RecordVaultBackupResponse:
      anyOf:
        - $ref: "#/components/schemas/VaultBackupRecordDto"
        - $ref: "#/components/schemas/ErrorResponse"
    RecordVaultBackupRequest:
      properties:
        event:
          $ref: "#/components/schemas/VaultBackupEvent"
        source:
          $ref: "#/components/schemas/VaultBackupSource"
        status:
          $ref: "#/components/schemas/VaultBackupStatus"
        errorCode:
          type: string
          nullable: true
        schemaVersion:
          type: number
          format: double
        blobTypes:
          items:
            $ref: "#/components/schemas/VaultBackupBlobType"
          type: array
        sizeBytes:
          type: number
          format: double
      required:
        - event
        - source
        - status
        - schemaVersion
        - blobTypes
        - sizeBytes
      type: object
      additionalProperties: false
    GetLatestVaultBackupResponse:
      anyOf:
        - $ref: "#/components/schemas/VaultBackupRecordDto"
        - $ref: "#/components/schemas/ErrorResponse"
    VaultBackupHistoryPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/VaultBackupRecordDto"
          type: array
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor
      type: object
      additionalProperties: false
    ListVaultBackupsResponse:
      anyOf:
        - $ref: "#/components/schemas/VaultBackupHistoryPage"
        - $ref: "#/components/schemas/ErrorResponse"
    ValidateErrorJSON:
      properties:
        message:
          type: string
          enum:
            - Validation failed
          nullable: false
        details:
          properties: {}
          additionalProperties: {}
          type: object
      required:
        - message
        - details
      type: object
      additionalProperties: false
    UserDeletionRefusal:
      description: Why `DELETE /users/me` refused a User Deletion (403 or 409).
      properties:
        message:
          type: string
      required:
        - message
      type: object
      additionalProperties: false
    UserDeletionBody:
      description: Body for `DELETE /users/me` (User Deletion).
      properties:
        password:
          type: string
        confirmation:
          type: string
          enum:
            - DELETE
          nullable: false
      required:
        - password
        - confirmation
      type: object
      additionalProperties: false
    FeedbackReportKind:
      type: string
      enum:
        - bug_report
        - suggestion
      description: "A Feedback Report is a Bug Report or a Suggestion (CONTEXT.md:
        Feedback)."
    FeedbackReportStatus:
      type: string
      enum:
        - received
        - under_review
        - planned
        - fixed
        - shipped
        - wont_do
        - cannot_reproduce
      description: Where a Feedback Report stands as its reporter sees it. There is no
        Duplicate status.
    FeedbackReportDto:
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/FeedbackReportKind"
        status:
          $ref: "#/components/schemas/FeedbackReportStatus"
        title:
          type: string
        createdAt:
          type: string
      required:
        - id
        - kind
        - status
        - title
        - createdAt
      type: object
      additionalProperties: false
    CreateFeedbackReportResponse:
      anyOf:
        - $ref: "#/components/schemas/FeedbackReportDto"
        - $ref: "#/components/schemas/ErrorResponse"
    ReportContextRequest:
      description: >-
        The Report Context the sender saw before sending. It never carries

        screenshots, logs, or anything read from the Vault, and `path` is the
        page

        path alone — no query string and no fragment.
      properties:
        platform:
          type: string
          description: Which app sent the report — `web` for the dashboard.
        appVersion:
          type: string
        browser:
          type: string
        operatingSystem:
          type: string
        path:
          type: string
        sentAt:
          type: string
          description: ISO 8601 instant shown in the Report Context preview.
      required:
        - platform
        - appVersion
        - browser
        - operatingSystem
        - path
        - sentAt
      type: object
      additionalProperties: false
    CreateFeedbackReportRequest:
      properties:
        kind:
          $ref: "#/components/schemas/FeedbackReportKind"
        title:
          type: string
        description:
          type: string
        expectedOutcome:
          type: string
          description: Bug Report only — what the sender expected to happen.
        context:
          $ref: "#/components/schemas/ReportContextRequest"
        fixNoticeOptIn:
          type: boolean
          description: Fix Notice opt-in. The dialog ticks it by default.
      required:
        - kind
        - title
        - description
        - context
        - fixNoticeOptIn
      type: object
      additionalProperties: false
    FeedbackReportListItemDto:
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/FeedbackReportKind"
        status:
          $ref: "#/components/schemas/FeedbackReportStatus"
        title:
          type: string
        statusNote:
          type: string
          nullable: true
        releaseTag:
          type: string
          nullable: true
        changelogUrl:
          type: string
          nullable: true
          description: Only set when releaseTag is present and status is 'fixed' or
            'shipped'.
        statusChangedAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - kind
        - status
        - title
        - statusNote
        - releaseTag
        - changelogUrl
        - statusChangedAt
        - createdAt
      type: object
      additionalProperties: false
    ListFeedbackReportsResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/FeedbackReportListItemDto"
          type: array
        hasChangedSinceLastSeen:
          type: boolean
      required:
        - items
        - hasChangedSinceLastSeen
      type: object
      additionalProperties: false
    MarkReportSeenResponse:
      properties:
        seenAt:
          type: string
      required:
        - seenAt
      type: object
      additionalProperties: false
    UserRole:
      type: string
      enum:
        - user
        - platform_admin
    FilteredUserInterface:
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        disabled:
          type: boolean
      required:
        - id
        - name
        - email
        - firstName
        - lastName
        - role
        - disabled
      type: object
      additionalProperties: false
    UserLoginBody:
      properties:
        email:
          type: string
        password:
          type: string
        client_type:
          type: string
          enum:
            - mobile
            - web
      required:
        - email
        - password
      type: object
      additionalProperties: false
    RefreshTokenBody:
      description: Refresh Token presented in a JSON body (mobile). Cookie remains the
        web channel.
      properties:
        refresh_token:
          type: string
      type: object
      additionalProperties: false
    RegisterUserResponse:
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/FilteredUserInterface"
      required:
        - message
      type: object
      additionalProperties: false
    UserCreationBody:
      properties:
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - firstName
        - lastName
        - email
        - password
      type: object
      additionalProperties: false
    ResetPasswordByEmailBody:
      properties:
        email:
          type: string
      required:
        - email
      type: object
      additionalProperties: false
    ConfirmResetPasswordBody:
      properties:
        token:
          type: string
        password:
          type: string
        confirm_password:
          type: string
      required:
        - token
        - password
        - confirm_password
      type: object
      additionalProperties: false
    YouTubeAccessUsageResponse:
      description: Platform Admin read of the YouTube Access lifetime ceiling (ADR 0129).
      properties:
        everGranted:
          type: number
          format: double
        ceiling:
          type: number
          format: double
      required:
        - everGranted
        - ceiling
      type: object
      additionalProperties: false
    AdminUserIdentity:
      description: Identity-only User projection for Platform Admin directory APIs.
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        disabled:
          type: boolean
        emailVerified:
          type: boolean
        youtubeAccess:
          type: boolean
          description: Whether a Platform Admin currently grants this User YouTube Access
            (ADR 0129).
      required:
        - id
        - name
        - email
        - firstName
        - lastName
        - role
        - disabled
        - emailVerified
        - youtubeAccess
      type: object
      additionalProperties: false
    YouTubeDisconnectOutcome:
      type: string
      enum:
        - completed
        - pending
        - not_connected
      description: Outcome of the YouTube Disconnect that a withdrawal triggers (ADR 0129).
    WithdrawYouTubeAccessResponse:
      allOf:
        - $ref: "#/components/schemas/AdminUserIdentity"
        - properties:
            youtubeDisconnect:
              $ref: "#/components/schemas/YouTubeDisconnectOutcome"
          required:
            - youtubeDisconnect
          type: object
      description: Identity after a YouTube Access withdrawal, with the disconnect outcome.
    AdminAuditAction:
      type: string
      enum:
        - disable
        - enable
        - force_logout
        - resend_verification
        - promote
        - demote
        - youtube_access_grant
        - youtube_access_withdraw
    AdminAuditLogEntry:
      description: Platform Admin Audit Log entry returned by list APIs.
      properties:
        id:
          type: string
        actorUserId:
          type: string
          nullable: true
          description: Null once the acting User has been removed by User Deletion.
        targetUserId:
          type: string
          nullable: true
          description: Null once the affected User has been removed by User Deletion.
        action:
          $ref: "#/components/schemas/AdminAuditAction"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorUserId
        - targetUserId
        - action
        - createdAt
      type: object
      additionalProperties: false
  securitySchemes:
    OAuth2PasswordSecurity:
      type: oauth2
      description: OAuth2 Password Grant
      flows:
        password:
          tokenUrl: http://localhost:3000/api/v1/auth/login
          scopes: {}
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token only
    cron-secret:
      type: apiKey
      in: header
      name: X-Cron-Secret
      description: Shared secret for cron-triggered endpoints
info:
  title: "@myorganiser/source"
  version: 1.1.0
  license:
    name: Elastic-2.0
  contact: {}
paths:
  /youtube/acknowledgement:
    get:
      operationId: GetAcknowledgement
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeAcknowledgementResponse"
        "426":
          description: Below the Version Floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionFloorRefusal"
      description: >-
        Returns the one-time YouTube acknowledgement state for the signed-in
        User

        (ADR 0129). `acknowledgedAt` is null until the User accepts it.
      tags:
        - YouTube
      security:
        - jwt:
            - youtube_access
      parameters: []
    post:
      operationId: AcceptAcknowledgement
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/YouTubeAcknowledgementResponse"
                  - $ref: "#/components/schemas/YouTubeErrorResponse"
        "426":
          description: Below the Version Floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionFloorRefusal"
      description: >-
        Records the signed-in User's one-time YouTube acknowledgement (ADR
        0129).

        The first accepted time is kept: calling again returns it unchanged.
      tags:
        - YouTube
      security:
        - jwt:
            - youtube_access
      parameters: []
  /youtube/auth-url:
    get:
      operationId: GetAuthUrl
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AuthUrlResponse"
                  - $ref: "#/components/schemas/AcknowledgementRequiredResponse"
                  - $ref: "#/components/schemas/YouTubeErrorResponse"
        "409":
          description: The YouTube acknowledgement has not been accepted yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcknowledgementRequiredResponse"
        "426":
          description: Below the Version Floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionFloorRefusal"
      description: >-
        Returns the Google OAuth consent URL for linking YouTube. Refused with
        409

        until the User has stored the one-time acknowledgement (ADR 0129).
      tags:
        - YouTube
      security:
        - jwt:
            - youtube_access
      parameters: []
  /youtube/callback:
    post:
      operationId: HandleCallback
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
                required:
                  - message
                  - ok
                type: object
        "426":
          description: Below the Version Floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionFloorRefusal"
      description: OAuth callback — exchanges the authorization code for tokens.
      tags:
        - YouTube
      security:
        - jwt:
            - youtube_access
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
              required:
                - code
              type: object
  /youtube/status:
    get:
      operationId: GetConnectionStatus
      responses:
        "200":
