buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// From a clean tree (`yarn mobile:release:build` runs `clean`), Gradle can
// configure a module's CMake build before Reanimated and Worklets have written
// the prefab packages it imports (the app and Gesture Handler both do), and
// prefab fails with "is not readable". Make every other module's configure
// wait for those packages.
def prefabLibraries = [':react-native-reanimated', ':react-native-worklets']
subprojects { project ->
    if (project.path in prefabLibraries) return
    project.tasks.matching { it.name.startsWith('configureCMake') }.configureEach { task ->
        def variant = task.name.startsWith('configureCMakeDebug') ? 'Debug' : 'Release'
        prefabLibraries.findAll { rootProject.findProject(it) != null }.each { path ->
            task.dependsOn("${path}:prefab${variant}Package")
        }
    }
}
