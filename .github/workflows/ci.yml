name: CI

# runs-on is pinned to ubuntu-24.04. See docs/deployment/CI_CD_AND_RELEASE_PROCESS.md#runner-image.

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authoritative-lockfile-policy:
    name: Authoritative Lockfile Policy
    runs-on: ubuntu-24.04

    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo 'Lockfile policy runs only for pull_request events.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Block npm and pnpm lockfiles in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")"

          {
            echo '## Lockfile policy'
            echo
            echo 'Changed files in PR:'
            if [ -n "$changed_files" ]; then
              printf '%s\n' "$changed_files"
            else
              echo '(none)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          disallowed_lockfiles="$(printf '%s\n' "$changed_files" | grep -E '(^|/)(package-lock\.json|pnpm-lock\.yaml)$' || true)"

          if [ -n "$disallowed_lockfiles" ]; then
            echo '::error title=Disallowed lockfile detected::This repository accepts only yarn.lock in pull requests. Remove package-lock.json and pnpm-lock.yaml changes from the PR.'
            {
              echo
              echo 'Disallowed lockfile changes:'
              printf '%s\n' "$disallowed_lockfiles"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'No npm or pnpm lockfiles were introduced or modified in this pull request.' >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Check dependency review API availability
        id: dependency-review-availability
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"

          if [ "$status_code" = '200' ]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status_code" = '403' ] || [ "$status_code" = '404' ]; then
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$response_file"
          echo "Unexpected dependency review API response: $status_code" >&2
          exit 1

      - name: Checkout repository
        if: steps.dependency-review-availability.outputs.supported == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: steps.dependency-review-availability.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: development,runtime,unknown

      - name: Explain skipped dependency review
        if: steps.dependency-review-availability.outputs.supported != 'true'
        shell: bash
        env:
          STATUS_CODE: ${{ steps.dependency-review-availability.outputs.status_code }}
        run: |
          echo '::warning title=Dependency review skipped::GitHub dependency review is unavailable for this repository. Enable Dependency graph in repository settings to re-enable this check.'
          {
            echo '## Dependency review skipped'
            echo
            echo "GitHub's dependency review API returned HTTP ${STATUS_CODE:-unknown} for this repository."
            echo
            echo 'Enable Dependency graph in repository settings to re-enable actions/dependency-review-action.'
          } >> "$GITHUB_STEP_SUMMARY"

  secure-install-review:
    name: Secure Install Review
    runs-on: ubuntu-24.04
    needs: authoritative-lockfile-policy

    # Read by the two Report Audit jobs below. A failed job still publishes its
    # outputs, and audit_outcome is what tells a failed audit apart from a
    # failed install or a moved lockfile.
    outputs:
      audit_outcome: ${{ steps.npm-audit.outcome }}
      advisories: ${{ steps.audit-advisories.outputs.advisories }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependency metadata without scripts
        run: corepack yarn install --immutable --mode=skip-build

      - name: Verify frozen lockfile
        run: |
          git diff --ignore-cr-at-eol --exit-code -- yarn.lock

      - name: Check whether dependency manifests changed
        id: dependency-files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Content-aware, not path-aware: editing a `scripts` entry is not a
          # dependency change. yarn.lock and .yarnrc.yml still always trigger,
          # and every workspace manifest is inspected (the previous check only
          # looked at the root package.json).
          #
          # If the detector itself fails, audit anyway — never skip on error.
          if ! result="$(node tools/scripts/ci/dependency-manifest-changed.mjs "$BASE_SHA" "$HEAD_SHA")"; then
            echo '::warning title=Dependency detection failed::Falling back to running the audit.'
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$result" = 'true' ]; then
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_audit=false' >> "$GITHUB_OUTPUT"
          fi

      # Pull requests audit only when they change dependencies; a push audits
      # unconditionally, so a new advisory surfaces on main and not on an
      # unrelated pull request. See ADR 0124.
      - name: Run Yarn npm audit
        id: npm-audit
        if: github.event_name != 'pull_request' || steps.dependency-files.outputs.run_audit == 'true'
        run: corepack yarn npm audit --all --recursive --severity high

      # The audit above stays the human-readable log and the step that fails
      # the job. This second pass only reshapes what it found for the tracked
      # issue, and only where that issue is reported: a push to main.
      - name: Collect advisories for the tracked issue
        id: audit-advisories
        if: ${{ failure() && steps.npm-audit.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -uo pipefail

          corepack yarn npm audit --all --recursive --severity high --json > "$RUNNER_TEMP/npm-audit.ndjson" || true
          echo "advisories=$(node tools/scripts/ci/npm-audit-advisories.mjs < "$RUNNER_TEMP/npm-audit.ndjson")" >> "$GITHUB_OUTPUT"

      - name: Explain skipped npm audit
        if: github.event_name == 'pull_request' && steps.dependency-files.outputs.run_audit != 'true'
        shell: bash
        run: |
          echo 'Skipped npm audit because this pull request changes no dependencies: yarn.lock and .yarnrc.yml are untouched, and any package.json edits were confined to non-dependency fields such as `scripts`.' >> "$GITHUB_STEP_SUMMARY"

  # Push to main only (ADR 0124). A pull request that fails the audit already
  # shows its author the red check, and a workflow_dispatch failure is a person
  # poking the pipeline; neither should open an issue the next green push to
  # main would then have to interpret. A cancelled run is neither outcome, so
  # neither report job runs.
  report-audit-failure:
    name: Report Audit Failure
    runs-on: ubuntu-24.04
    needs: secure-install-review
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secure-install-review.outputs.audit_outcome == 'failure' }}

    # Job permissions replace the workflow set, so contents: read is restated.
    # Checkout uses it to load the audit-issue module; issues: write is the
    # only extra scope, and it lives here rather than on the job that installs
    # dependencies.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same shape as nightly-e2e.yml: one open issue that gets commented on,
      # rather than a new issue for every failing push. The title and label
      # list live in tools/scripts/lib/npm-audit-issue.mjs — not a second copy
      # here. Advisory text is third-party input, so it arrives through the
      # environment and is never interpolated into the script.
      - name: Open or update the audit issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADVISORIES: ${{ needs.secure-install-review.outputs.advisories }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const {
              AUDIT_ISSUE_TITLE,
              AUDIT_ISSUE_CREATE_LABELS,
              failureReport,
              findOpenAuditIssue,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/tools/scripts/lib/npm-audit-issue.mjs`,
              ).href
            );

            let advisories = [];
            try {
              const parsed = JSON.parse(process.env.ADVISORIES || '[]');
              if (Array.isArray(parsed)) advisories = parsed;
            } catch {
              core.warning('The advisories output was not JSON; reporting without them.');
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = failureReport({
              runUrl,
              date: new Date().toISOString().slice(0, 10),
              sha: context.sha.slice(0, 8),
              advisories,
            });

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const match = findOpenAuditIssue(existing);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              core.info(`Commented on existing issue #${match.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: AUDIT_ISSUE_TITLE,
              body,
              labels: [...AUDIT_ISSUE_CREATE_LABELS],
            });
            core.info(`Created issue #${created.data.number}`);

  # The first green push to main after a failure is the recovery. Every later
  # green push finds the newest report already says "recovered" and does
  # nothing, so an issue kept open for triaged work is not commented on by
  # each merge. What recovery does with the issue is recoveryAction(), the
  # nightly E2E rot issue's rule: closed when it carries no triage state
  # label, commented on and left open when it carries one.
  report-audit-success:
    name: Report Audit Success
    runs-on: ubuntu-24.04
    needs: secure-install-review
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secure-install-review.outputs.audit_outcome == 'success' }}

    # Least privilege. Job permissions replace the workflow set, so
    # contents: read is restated for the checkout. issues: write covers the
    # comment and, when the issue was never triaged, the close. Nothing else.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Close or comment on the audit issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const {
              AUDIT_ISSUE_TITLE,
              findOpenAuditIssue,
              lastReportedState,
              recoveryAction,
              recoveryComment,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/tools/scripts/lib/npm-audit-issue.mjs`,
              ).href
            );

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = findOpenAuditIssue(existing);

            if (!match) {
              core.info(`No open issue titled ${AUDIT_ISSUE_TITLE}`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              per_page: 100,
            });

            if (lastReportedState({ body: match.body, comments }) === 'recovered') {
              core.info(`Recovery already recorded on issue #${match.number}`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const action = recoveryAction(match.labels);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: recoveryComment({
                action,
                runUrl,
                date: new Date().toISOString().slice(0, 10),
                sha: context.sha.slice(0, 8),
              }),
            });

            if (action === 'close') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed audit issue #${match.number}`);
              return;
            }

            core.info(`Audit recovered; left triaged issue #${match.number} open`);

  prepare-dependencies:
    name: Prepare Dependency Cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: secure-install-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # We intentionally avoid setup-node's Yarn cache integration here.
      # In this repo it can invoke the runner's global Yarn 1 binary before
      # Corepack has a chance to resolve the pinned Yarn 4 version.
      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

  chromatic:
    name: Publish to Chromatic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare-dependencies

    env:
      STORYBOOK_BUILD_TIMEOUT: '900000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Publish Storybook to Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          CHROMATIC_AUTO_ACCEPT: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u

          if [ -z "${CHROMATIC_PROJECT_TOKEN}" ]; then
            echo '::error title=Missing Chromatic token::Add repository secret CHROMATIC_PROJECT_TOKEN (HITL) before this job can run. See docs/storybook/README.md and ADR 0027.'
            exit 1
          fi

          extra=(--exit-zero-on-changes)
          if [ "${CHROMATIC_AUTO_ACCEPT}" = 'true' ]; then
            extra+=(--auto-accept-changes)
          fi

          if [ "${EVENT_NAME}" = 'pull_request' ]; then
            export CHROMATIC_SHA="${PR_SHA}"
            export CHROMATIC_BRANCH="${PR_BRANCH}"
            export CHROMATIC_SLUG="${REPO}"
          fi

          set +e
          corepack yarn chromatic "${extra[@]}"
          code=$?
          set -e

          if [ "${code}" -eq 11 ]; then
            echo '::warning title=Chromatic quota reached::Free-plan snapshot cap reached (CLI exit 11). Visual tests are paused until the next billing cycle. CI continues per ADR 0027.'
            {
              echo '## Publish to Chromatic'
              echo
              echo 'Snapshot quota reached (`ACCOUNT_QUOTA_REACHED`, exit 11). Job passed by policy so the rest of CI is not frozen for the rest of the month.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # BUILD_HAS_CHANGES: capture succeeded; review lives on Chromatic's "UI Tests"
          # GitHub status (pending until Accept/Deny). Do not fail this job — a re-run
          # recaptures snapshots and burns free-tier quota.
          if [ "${code}" -eq 1 ]; then
            echo '::notice title=Visual changes awaiting review::Accept or Deny in Chromatic. The UI Tests check stays pending until then. Do not re-run this job.'
            {
              echo '## Publish to Chromatic'
              echo
              echo 'Unreviewed visual changes (`BUILD_HAS_CHANGES`). This job passed so snapshots are not recaptured.'
              echo 'Watch Chromatic’s **UI Tests** check: pending until Accept (green) or Deny (red).'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "${code}"

  setup:
    name: Setup Affected Context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare-dependencies

    outputs:
      nx_base: ${{ steps.affected.outputs.nx_base }}
      nx_head: ${{ steps.affected.outputs.nx_head }}
      affected_projects: ${{ steps.projects.outputs.affected_projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Compute affected range
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ -z "$BASE" || "$BASE" == '0000000000000000000000000000000000000000' ]]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          fi

          echo "nx_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "nx_head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Using NX_BASE=$BASE"
          echo "Using NX_HEAD=$HEAD"

      - name: Compute affected projects
        id: projects
        shell: bash
        run: |
          set -euo pipefail

          BASE='${{ steps.affected.outputs.nx_base }}'
          HEAD='${{ steps.affected.outputs.nx_head }}'

          if ! AFFECTED_JSON="$(corepack yarn nx show projects --affected --base="$BASE" --head="$HEAD" --json | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); process.stdout.write(JSON.stringify(JSON.parse(input))); ")"; then
            echo 'Error: Failed to compute affected projects JSON from Nx output.' >&2
            exit 1
          fi

          echo "affected_projects=$AFFECTED_JSON" >> "$GITHUB_OUTPUT"
          echo "Affected projects: $AFFECTED_JSON"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      # Whole tree. Without --all, nx format:check diffs against main, which
      # this checkout does not have. A skipped Husky hook never rewrites, so
      # this step is what fails the Lint check (issue #791).
      - name: Check formatting
        run: corepack yarn format:check --all

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-lint-
            ${{ runner.os }}-nx-22-

      - name: Lint affected projects
        run: corepack yarn nx affected -t lint --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: setup

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway runner service. Trust avoids storing a credential in the
          # workflow; this database is never reachable off the job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: myorganiser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Prisma generate reads this without connecting; migrate deploy and
      # migrate diff use the service above so a migration that fails to apply,
      # or a schema that has drifted from the migrations, fails before merge.
      DATABASE_URL: postgresql://postgres@localhost:5432/myorganiser

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Java 21
        # openapi:check regenerates the client via openapi-generator-cli, which is
        # a Java tool. Pinned explicitly rather than relying on the runner image's
        # preinstalled JDK, which is not part of the runner's stability contract.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Check OpenAPI spec and generated client are in sync
        # Regenerates the spec and client, then asserts a clean tree. Runs before
        # the hygiene steps so an unrelated step cannot dirty the tree first.
        run: corepack yarn openapi:check

      - name: Check design token outputs are in sync
        # Same shape as openapi:check and for the same reason: src/generated is
        # derived from tokens.json, and nothing asserted the two agreed until
        # ADR 0098 needed a Covering Gate for the tokens trigger. Runs next to
        # openapi:check so both regenerate before anything else can dirty the tree.
        run: corepack yarn design-tokens:check

      - name: Component hygiene checker contracts
        run: corepack yarn component:hygiene:test

      - name: Check component hygiene
        run: corepack yarn component:hygiene --all --max-warnings=0

      - name: Test hygiene checker contracts
        run: corepack yarn test:hygiene:test

      - name: Check Jest test hygiene
        run: corepack yarn test:hygiene --all

      - name: Design hygiene checker contracts
        run: corepack yarn design:hygiene:test

      - name: Check House Explainer Page hygiene
        # --all also fails on a page under docs/ that is in neither ROSTER nor
        # LEGACY, which is the half Husky cannot see: a new page is unstaged
        # against the roster exactly once, here.
        run: corepack yarn design:hygiene --all

      - name: PR runner label and merge-base gate contracts
        run: corepack yarn ai:create-pr:test

      - name: Sandcastle resume decision contracts
        run: corepack yarn sandcastle:resume:test

      - name: Sandcastle slice-selection contracts
        run: corepack yarn sandcastle:slice-selection:test

      - name: Sandcastle sub-agent trace contracts
        run: corepack yarn sandcastle:subagent-trace:test

      - name: Sandcastle spec-anchor contracts
        run: corepack yarn sandcastle:spec-anchor:test

      - name: Sandcastle run-outcome contracts
        run: corepack yarn sandcastle:outcome:test

      - name: Sandcastle orphaned-worktree repair contracts
        run: corepack yarn sandcastle:worktree-repair:test

      - name: OpenAPI artifact checker contracts
        run: corepack yarn openapi:artifacts:test

      - name: Tree-clean assertion contracts
        run: corepack yarn git-assert-clean:test

      - name: Env-declared checker contracts
        run: corepack yarn env:declared:test

      - name: Sub-agent sync contracts (harness sections, tool grants)
        run: corepack yarn agents:sync:test

      - name: Env-deployment checker contracts
        run: corepack yarn env:deployment:test

      - name: Feature index checker contracts
        run: corepack yarn feature-index:test

      - name: Documented-command checker contracts
        run: corepack yarn docs:commands:test

      - name: Documented file-ref checker contracts
        run: corepack yarn docs:file-refs:test

      - name: README checker contracts
        run: corepack yarn readme:test

      - name: Release pipeline page checker contracts
        run: corepack yarn deploy:pages:test

      - name: Brand logo generator contracts
        run: corepack yarn brand:logos:test

      - name: Host Apply engine contracts
        run: corepack yarn host-apply:test

      - name: Release script contracts
        run: corepack yarn release:test

      - name: Dependency-audit detector contracts
        run: corepack yarn dependency-manifest:test

      - name: GitHub CLI helper contracts
        run: corepack yarn gh:lib:test

      - name: Host Apply workflow checker contracts
        run: corepack yarn host-apply:workflow:test

      - name: Staging web deploy contracts
        run: corepack yarn staging-web:test

      - name: Nightly E2E rot-issue contracts
        run: corepack yarn nightly-e2e:rot:test

      - name: npm audit issue contracts
        run: corepack yarn npm-audit:issue:test

      - name: Lint coverage checker contracts
        run: corepack yarn lint:coverage:test

      # Project names, roots, and targets. `backend:generate-types` only writes
      # the Prisma client, and no Nx plugin infers a project or target from
      # that output, so this file stays valid for the checkers after generate.
      # Review Tier is a separate workflow and its only graph consumer, so it
      # still builds its own. Each checker used to spawn `nx graph` itself;
      # that build is the slow part (ADR 0043 records the lint checker at 19s).
      # One graph for the three checkers in this job that read it (issue #1061).
      # A missing or mistyped path fails the checker; it does not rebuild.
      # The path goes through GITHUB_ENV because job-level `env` cannot read the
      # `runner` context: `${{ runner.temp }}` there rejects the whole workflow.
      - name: Build the Nx project graph
        run: |
          echo "NX_GRAPH_FILE=$RUNNER_TEMP/nx-graph.json" >> "$GITHUB_ENV"
          corepack yarn nx graph --file "$RUNNER_TEMP/nx-graph.json"

      # Asserts every project Nx can lint is reachable as `lint`, the target the
      # lint job selects. Five projects were outside it until #426.
      - name: Check lint gate coverage
        run: corepack yarn lint:coverage:check "$NX_GRAPH_FILE"

      - name: Nx graph loader contracts
        run: corepack yarn nx-graph:test

      - name: Typecheck checker contracts
        run: corepack yarn typecheck:check:test

      # apps/backend/src/prisma is generated and gitignored, so a fresh runner
      # has no @prisma/client to compile against. backend:test declares this
      # same dependency; typechecking needs it just as much, and runs first.
      - name: Generate Prisma client
        run: corepack yarn nx run backend:generate-types

      - name: Apply Prisma migrations and check schema drift
        working-directory: apps/backend/src
        run: |
          npx prisma migrate deploy --schema prisma/schema
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

      # Compiles each project's production and spec programs. Nothing ran
      # TypeScript in CI before this, so two type errors had reached main.
      # The graph was built above; this step needs the generated Prisma client,
      # not a second graph.
      - name: Typecheck all projects
        run: corepack yarn typecheck:check "$NX_GRAPH_FILE"

      - name: Check libs markdown allowlist
        run: corepack yarn libs:markdown:check

      - name: Check docs notes routing
        run: corepack yarn docs:notes:check

      # ADR numbers collide across concurrent branches, not within one commit:
      # git merges two differently-named files cleanly. This runs in Test
      # because that job checks out refs/pull/N/merge — the merged tree, the
      # only vantage point where both files exist.
      - name: Check ADR numbering
        run: corepack yarn adr:numbering:check

      - name: Check ADR status
        run: corepack yarn adr:status:check

      # A fix names the change that introduced its defect, or declares that
      # nothing can be named (ADR 0100) — the line the escaped-defect rate is
      # built from. Pull requests only: a push has no head branch to type.
      # Branch and title reach the script through env and are never
      # interpolated into the shell, because both are author-controlled text.
      - name: Check a fix names its origin
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: corepack yarn fix:attribution:check --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --title "$PR_TITLE"

      - name: Check documented commands resolve
        run: corepack yarn docs:commands:check

      - name: Check documented file-refs resolve
        run: corepack yarn docs:file-refs:check

      - name: Documented Nx target checker contracts
        run: corepack yarn docs:nx-targets:test

      # Asserts every `nx run <project>:<target>` and `nx <target> <project>` in
      # tracked Markdown resolves in the project graph. DEVELOPMENT.md taught two
      # targets that never existed until #980. Reads the graph built once above,
      # so CI only — Husky does not run it.
      - name: Check documented Nx targets resolve
        run: corepack yarn docs:nx-targets:check "$NX_GRAPH_FILE"

      - name: Enum fan-out checker contracts
        run: corepack yarn enum:fanout:test

      - name: Tailwind class checker contracts
        run: corepack yarn tailwind:classes:test

      - name: Content glob checker contracts
        run: corepack yarn content-globs:test

      - name: Web app icon checker contracts
        run: corepack yarn web:app-icons:test

      - name: Mobile app icon checker contracts
        run: corepack yarn mobile:app-icon:test

      - name: Mobile platform checker contracts
        run: corepack yarn mobile-platform:test

      - name: Signing material checker contracts
        run: corepack yarn signing-material:test

      - name: Mobile Release publish contracts
        run: corepack yarn mobile:release:test

      - name: Prisma migration history checker contracts
        run: corepack yarn prisma:migrations:test

      - name: Agent orchestration map checker contracts
        run: corepack yarn agents:map:test

      - name: Agent model audit contracts (retirement table)
        run: corepack yarn agents:models:test

      - name: Gate manifest checker contracts
        run: corepack yarn gates:run:test

      - name: Nx project tag checker contracts
        run: corepack yarn nx:tags:test

      - name: Review tier classifier contracts
        run: corepack yarn review:tier:test

      - name: Code review report contracts
        run: corepack yarn review:test

      - name: Code review concurrency checker contracts
        run: corepack yarn review:concurrency:test

      - name: Review checklist checker contracts
        run: corepack yarn review:checklist:test

      - name: Reviewer tool allowlist checker contracts
        run: corepack yarn review:allowlist:test

      - name: Rule catalogue checker contracts
        run: corepack yarn review:rules:test

      - name: Golden replay results record checker contracts
        run: corepack yarn review:golden:results:test

      - name: Gate coverage checker contracts
        run: corepack yarn gates:coverage:test

      - name: Upstream Brief report contract and checker contracts
        run: corepack yarn upstream:briefs:test

      - name: Checker contract coverage checker contracts
        run: corepack yarn checker-contracts:test

      - name: ADR status checker contracts
        run: corepack yarn adr:status:test

      - name: Fix attribution checker contracts
        run: corepack yarn fix:attribution:test

      - name: Escape Copy reader gate contracts
        run: corepack yarn escape-copy-reader:test

      - name: QA Account seeder contracts
        run: corepack yarn qa:accounts:test

      # The meta-gate: asserts every check-*.mjs is invoked by some hook or
      # workflow, resolving one level of indirection through the aggregate's
      # manifest. Nine checkers ran nowhere when ADR 0043 was written.
      - name: Check gate coverage
        run: corepack yarn gates:coverage:check

      # The checks below also run through `yarn gates:run` in the pre-commit
      # hook (ADR 0043). CI runs each as its own named step instead of the
      # aggregate so a failure is identifiable without opening a log.

      # An instruction the reviewer is refused permission to follow is an
      # instruction nothing can carry out, and it is not free: run 45's guard
      # case spent 26 permission denials of an 81-turn budget and wrote no
      # report at all. This ran CI-only while it still failed on the tree that
      # introduced it, because the aggregate is what `.husky/pre-commit` calls
      # and wiring it there sooner would have blocked every commit in the
      # repository. It has passed since the contradiction was fixed, so it now
      # sits in `tools/scripts/lib/gate-manifest.mjs` with the rest.
      - name: Check the reviewer may run what it is told to run
        run: corepack yarn review:allowlist:check

      - name: Check the review checklist against the obligation catalogue
        run: corepack yarn review:checklist:check

      - name: Check root README
        run: corepack yarn readme:check

      - name: Check OpenAPI generated artifacts
        run: corepack yarn openapi:artifacts

      - name: Check backend env vars are declared in .env.example
        run: corepack yarn env:declared:check

      - name: Check deployment doc env vars are declared in .env.example
        run: corepack yarn env:deployment:check

      - name: Check feature index against dashboard routes
        run: corepack yarn feature-index:check

      - name: Check agent orchestration map
        run: corepack yarn agents:map:check

      - name: Check vault diagram pages
        run: corepack yarn vault:pages:check

      - name: Check auth diagram pages
        run: corepack yarn auth:pages:check

      - name: Check Nx project tags
        run: corepack yarn nx:tags:check

      - name: Check review pipeline page
        run: corepack yarn review:pages:check

      - name: Check the code-review golden set
        run: corepack yarn review:golden:check

      - name: Check the golden replay results record
        run: corepack yarn review:golden:results:check

      - name: Check release pipeline page
        run: corepack yarn deploy:pages:check

      - name: Check Host Apply workflow wiring
        run: corepack yarn host-apply:workflow:check

      - name: Check sub-agent sync
        run: corepack yarn agents:sync:check

      # A fan-out over a guarded domain enum must reach its pinned table
      # rather than hand-enumerate the members (ADR 0053). TypeScript catches
      # the omission only at call sites written to be caught; this catches the
      # ones that were not.
      - name: Check guarded enum fan-outs are pinned
        run: corepack yarn enum:fanout:check

      # Tailwind silently drops a class name it cannot resolve, so a colour
      # utility that paints nothing ships without a build error (issue #632).
      - name: Check Tailwind colour utilities resolve
        run: corepack yarn tailwind:classes:check

      # A Storybook stories glob or Tailwind content glob that matches nothing
      # drops stories or classes without an error (issue #898).
      - name: Check Storybook and Tailwind globs match files
        run: corepack yarn content-globs:check

      # A bare `react-native/…` subpath import is deprecated at 0.80 with
      # removal planned; browser globals are scanned in all mobile source, and
      # mobile must reach shared libraries through Portable Entry Points (ADR 0103).
      # ADR 0064: the Escape Copy must be openable by a tool that needs nothing
      # of ours, and a gate must assert the tool still opens a freshly produced
      # envelope. This builds the reader and runs it against an envelope the
      # real exporter produces here, so a schema move that outruns the reader
      # fails now rather than on the day somebody needs it. CI-only: it builds
      # a 500 KB page and runs PBKDF2 four times, which is more than the
      # pre-commit aggregate is for.
      - name: Check the Escape Copy reader opens a fresh envelope
        run: corepack yarn escape-copy-reader:check

      - name: Check web app icons match the shield and tokens
        run: corepack yarn web:app-icons:check

      - name: Check mobile app icon matches the shield and tokens
        run: corepack yarn mobile:app-icon:check

      - name: Check mobile platform rules
        run: corepack yarn mobile-platform:check

      # Why a committed keystore is unrecoverable: see the checker's header.
      - name: Check no signing material is committed
        run: corepack yarn signing-material:check

      # The file-reading half of the Prisma migration gate (ADR 0094). The
      # half that needs a database is the "Apply Prisma migrations and check
      # schema drift" step above, against this job's Postgres service.
      - name: Check Prisma migration history
        run: corepack yarn prisma:migrations:check

      # A committed Upstream Brief report is frozen at its date, so its local
      # evidence is checked against the commit it records rather than the tree
      # in front of it. That is what lets a frozen brief stay checkable — and
      # what makes a citation that stopped matching a fact worth failing on
      # (ADR 0084 item 10).
      - name: Check committed Upstream Brief reports
        run: corepack yarn upstream:briefs:check

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-test-
            ${{ runner.os }}-nx-22-

      - name: Test affected projects
        run: corepack yarn nx affected -t test --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }}

      - name: Workflow runner image contracts
        run: corepack yarn runner-image:test

      - name: Check workflow jobs pin ubuntu-24.04
        run: corepack yarn runner-image:check

  e2e:
    name: E2E Chromium (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pull requests only: the same commits ran this seconds earlier on the PR,
    # and the nightly workflow covers `main`. See ADR 0050.
    if: ${{ github.event_name == 'pull_request' && contains(fromJson(needs.setup.outputs.affected_projects), 'web-e2e') }}
    # Deliberately NOT gated on `test`, unlike build-backend/build-frontend.
    # Waiting for the unit tests serialised E2E behind them and put the critical
    # path at 11 minutes; running alongside them brings it back to ~8. The cost
    # is that E2E still burns a runner when the unit tests are already failing,
    # which is free on a public repository. See ADR 0050.
    needs:
      - setup
      - lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      # Playwright's webServer starts Nx as a nested child process, and the Nx
      # daemon does not survive that cleanly on hosted runners.
      NX_DAEMON: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-e2e-
            ${{ runner.os }}-nx-22-

      # Only the browser this lane needs. Playwright advises against caching
      # browser binaries: restoring the cache costs about what downloading does.
      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      # Built here rather than inside Playwright's webServer timeout, so a build
      # failure is attributable and starting the server is only that.
      - name: Build frontend for E2E
        run: corepack yarn nx build web

      - name: Run E2E shard
        run: corepack yarn nx run web-e2e:e2e --shard=${{ matrix.shard }}/3 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e-report:
    name: E2E Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs:
      - e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into a single HTML report
        run: corepack yarn playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-html-report
          path: playwright-report/
          retention-days: 7

  build-backend:
    name: Build Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'backend') }}
    needs:
      - setup
      - lint
      - test

    env:
      # Required for Prisma v7 config loading during `prisma generate`.
      # CI uses a dummy local URL here because generation does not connect.
      DATABASE_URL: postgresql://localhost:5432/myorganiser

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build backend
        run: corepack yarn nx build backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'web') }}
    needs:
      - setup
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build frontend
        run: corepack yarn nx build web

  # Not a shard of the hermetic lane (ADR 0050). That lane stubs /auth/logout.
  # Starting the real API beside those stubs makes unmocked calls hit it and
  # the shard times out. This job runs only the live logout spec.
  e2e-live-logout:
    name: E2E live logout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'pull_request' && contains(fromJson(needs.setup.outputs.affected_projects), 'web-e2e') }}
    needs:
      - setup
      - lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: myorganiser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NX_DAEMON: 'false'
      E2E_LIVE_BACKEND: '1'
      DATABASE_URL: postgresql://postgres@localhost:5432/myorganiser
      ACCESS_JWT_SECRET: e2e-access-jwt
      REFRESH_JWT_SECRET: e2e-refresh-jwt
      VERIFY_JWT_SECRET: e2e-verify-jwt

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-e2e-
            ${{ runner.os }}-nx-22-

      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      - name: Build frontend for E2E
        run: corepack yarn nx build web

      - name: Build backend for live logout
        run: corepack yarn nx build backend

      - name: Run live logout spec
        run: corepack yarn nx e2e web-e2e --grep="logs out against the real backend"

      # User Deletion (#969) against the real API: its own seeded user, so the
      # logout spec above is unaffected.
      - name: Run live account deletion spec
        run: corepack yarn nx e2e web-e2e --grep="deletes the account against the real backend"
