name: CI

# runs-on is pinned to ubuntu-24.04. See docs/deployment/CI_CD_AND_RELEASE_PROCESS.md#runner-image.

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

# A pull request cancels its own superseded runs: nobody is waiting on the
# result of a commit that has already been pushed over.
#
# A push to `main` does not. The run in progress always finishes, and that
# run lints and tests the whole tree (the builds are still selected by the
# affected set — see the Workflows section of
# docs/deployment/CI_CD_AND_RELEASE_PROCESS.md). The reason this changed is
# the cache: `actions/cache` writes in a job's post step, so a cancelled run
# saves nothing and leaves the Nx baseline at whatever the last uncancelled
# push managed to save. That baseline is what every pull request restores
# from, and a `main` that cancels itself under a burst of merges is how it
# went stale. It is not a per-commit guarantee: GitHub keeps one run pending
# per concurrency group, so a third push still cancels the run queued behind
# the one in progress, and that commit is covered by the next run rather than
# by its own. Superseded entries are pruned afterwards by cache-cleanup.yml
# rather than by refusing to save them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  authoritative-lockfile-policy:
    name: Authoritative Lockfile Policy
    runs-on: ubuntu-24.04

    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo 'Lockfile policy runs only for pull_request events.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Block npm and pnpm lockfiles in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")"

          {
            echo '## Lockfile policy'
            echo
            echo 'Changed files in PR:'
            if [ -n "$changed_files" ]; then
              printf '%s\n' "$changed_files"
            else
              echo '(none)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          disallowed_lockfiles="$(printf '%s\n' "$changed_files" | grep -E '(^|/)(package-lock\.json|pnpm-lock\.yaml)$' || true)"

          if [ -n "$disallowed_lockfiles" ]; then
            echo '::error title=Disallowed lockfile detected::This repository accepts only yarn.lock in pull requests. Remove package-lock.json and pnpm-lock.yaml changes from the PR.'
            {
              echo
              echo 'Disallowed lockfile changes:'
              printf '%s\n' "$disallowed_lockfiles"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'No npm or pnpm lockfiles were introduced or modified in this pull request.' >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Check dependency review API availability
        id: dependency-review-availability
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"

          if [ "$status_code" = '200' ]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status_code" = '403' ] || [ "$status_code" = '404' ]; then
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$response_file"
          echo "Unexpected dependency review API response: $status_code" >&2
          exit 1

      - name: Checkout repository
        if: steps.dependency-review-availability.outputs.supported == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: steps.dependency-review-availability.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: development,runtime,unknown

      - name: Explain skipped dependency review
        if: steps.dependency-review-availability.outputs.supported != 'true'
        shell: bash
        env:
          STATUS_CODE: ${{ steps.dependency-review-availability.outputs.status_code }}
        run: |
          echo '::warning title=Dependency review skipped::GitHub dependency review is unavailable for this repository. Enable Dependency graph in repository settings to re-enable this check.'
          {
            echo '## Dependency review skipped'
            echo
            echo "GitHub's dependency review API returned HTTP ${STATUS_CODE:-unknown} for this repository."
            echo
            echo 'Enable Dependency graph in repository settings to re-enable actions/dependency-review-action.'
          } >> "$GITHUB_STEP_SUMMARY"

  secure-install-review:
    name: Secure Install Review
    runs-on: ubuntu-24.04
    needs: authoritative-lockfile-policy

    # Read by the two Report Audit jobs below. A failed job still publishes its
    # outputs, and audit_outcome is what tells a failed audit apart from a
    # failed install or a moved lockfile.
    outputs:
      audit_outcome: ${{ steps.npm-audit.outcome }}
      advisories: ${{ steps.audit-advisories.outputs.advisories }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      # Runs before the install, so a pull request that changes no dependency
      # can skip the script-free install and the frozen-lockfile check below
      # as well as the audit, instead of paying for an install it then throws
      # away (ADR 0124 amendment).
      - name: Check whether dependency manifests changed
        id: dependency-files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Content-aware, not path-aware: editing a `scripts` entry is not a
          # dependency change. yarn.lock and .yarnrc.yml still always trigger,
          # and every workspace manifest is inspected (the previous check only
          # looked at the root package.json).
          #
          # If the detector itself fails, audit anyway — never skip on error.
          if ! result="$(node tools/scripts/ci/dependency-manifest-changed.ts "$BASE_SHA" "$HEAD_SHA")"; then
            echo '::warning title=Dependency detection failed::Falling back to running the audit.'
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$result" = 'true' ]; then
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_audit=false' >> "$GITHUB_OUTPUT"
          fi

      # Pull requests install and verify the lockfile only when they change
      # dependencies, or when the detector above errored; a push always does
      # both, so a new advisory still surfaces on main. See ADR 0124.
      - name: Install dependency metadata without scripts
        if: github.event_name != 'pull_request' || steps.dependency-files.outputs.run_audit == 'true'
        run: corepack yarn install --immutable --mode=skip-build

      - name: Verify frozen lockfile
        if: github.event_name != 'pull_request' || steps.dependency-files.outputs.run_audit == 'true'
        run: |
          git diff --ignore-cr-at-eol --exit-code -- yarn.lock

      # Pull requests audit only when they change dependencies; a push audits
      # unconditionally, so a new advisory surfaces on main and not on an
      # unrelated pull request. See ADR 0124.
      - name: Run Yarn npm audit
        id: npm-audit
        if: github.event_name != 'pull_request' || steps.dependency-files.outputs.run_audit == 'true'
        run: corepack yarn npm audit --all --recursive --severity high

      # The audit above stays the human-readable log and the step that fails
      # the job. This second pass only reshapes what it found for the tracked
      # issue, and only where that issue is reported: a push to main.
      - name: Collect advisories for the tracked issue
        id: audit-advisories
        if: ${{ failure() && steps.npm-audit.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -uo pipefail

          corepack yarn npm audit --all --recursive --severity high --json > "$RUNNER_TEMP/npm-audit.ndjson" || true
          echo "advisories=$(node tools/scripts/ci/npm-audit-advisories.ts < "$RUNNER_TEMP/npm-audit.ndjson")" >> "$GITHUB_OUTPUT"

      - name: Explain skipped install review
        if: github.event_name == 'pull_request' && steps.dependency-files.outputs.run_audit != 'true'
        shell: bash
        run: |
          echo 'Skipped the script-free install, the frozen-lockfile check and the npm audit because this pull request changes no dependencies: yarn.lock and .yarnrc.yml are untouched, and any package.json edits were confined to non-dependency fields such as `scripts`.' >> "$GITHUB_STEP_SUMMARY"

  # Push to main only (ADR 0124). A pull request that fails the audit already
  # shows its author the red check, and a workflow_dispatch failure is a person
  # poking the pipeline; neither should open an issue the next green push to
  # main would then have to interpret. A cancelled run is neither outcome, so
  # neither report job runs.
  report-audit-failure:
    name: Report Audit Failure
    runs-on: ubuntu-24.04
    needs: secure-install-review
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secure-install-review.outputs.audit_outcome == 'failure' }}

    # Job permissions replace the workflow set, so contents: read is restated.
    # Checkout uses it to load the audit-issue module; issues: write is the
    # only extra scope, and it lives here rather than on the job that installs
    # dependencies.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same shape as nightly-e2e.yml: one open issue that gets commented on,
      # rather than a new issue for every failing push. The title and label
      # list live in tools/scripts/lib/npm-audit-issue.ts — not a second copy
      # here. Advisory text is third-party input, so it arrives through the
      # environment and is never interpolated into the script.
      - name: Open or update the audit issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADVISORIES: ${{ needs.secure-install-review.outputs.advisories }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const {
              AUDIT_ISSUE_TITLE,
              AUDIT_ISSUE_CREATE_LABELS,
              failureReport,
              findOpenAuditIssue,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/tools/scripts/lib/npm-audit-issue.ts`,
              ).href
            );

            let advisories = [];
            try {
              const parsed = JSON.parse(process.env.ADVISORIES || '[]');
              if (Array.isArray(parsed)) advisories = parsed;
            } catch {
              core.warning('The advisories output was not JSON; reporting without them.');
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = failureReport({
              runUrl,
              date: new Date().toISOString().slice(0, 10),
              sha: context.sha.slice(0, 8),
              advisories,
            });

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const match = findOpenAuditIssue(existing);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              core.info(`Commented on existing issue #${match.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: AUDIT_ISSUE_TITLE,
              body,
              labels: [...AUDIT_ISSUE_CREATE_LABELS],
            });
            core.info(`Created issue #${created.data.number}`);

  # The first green push to main after a failure is the recovery. Every later
  # green push finds the newest report already says "recovered" and does
  # nothing, so an issue kept open for triaged work is not commented on by
  # each merge. What recovery does with the issue is recoveryAction(), the
  # nightly E2E rot issue's rule: closed when it carries no triage state
  # label, commented on and left open when it carries one.
  report-audit-success:
    name: Report Audit Success
    runs-on: ubuntu-24.04
    needs: secure-install-review
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.secure-install-review.outputs.audit_outcome == 'success' }}

    # Least privilege. Job permissions replace the workflow set, so
    # contents: read is restated for the checkout. issues: write covers the
    # comment and, when the issue was never triaged, the close. Nothing else.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Close or comment on the audit issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const {
              AUDIT_ISSUE_TITLE,
              findOpenAuditIssue,
              lastReportedState,
              recoveryAction,
              recoveryComment,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/tools/scripts/lib/npm-audit-issue.ts`,
              ).href
            );

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = findOpenAuditIssue(existing);

            if (!match) {
              core.info(`No open issue titled ${AUDIT_ISSUE_TITLE}`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              per_page: 100,
            });

            if (lastReportedState({ body: match.body, comments }) === 'recovered') {
              core.info(`Recovery already recorded on issue #${match.number}`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const action = recoveryAction(match.labels);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: recoveryComment({
                action,
                runUrl,
                date: new Date().toISOString().slice(0, 10),
                sha: context.sha.slice(0, 8),
              }),
            });

            if (action === 'close') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed audit issue #${match.number}`);
              return;
            }

            core.info(`Audit recovered; left triaged issue #${match.number} open`);

  prepare-dependencies:
    name: Prepare Dependency Cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: secure-install-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      # We intentionally avoid setup-node's Yarn cache integration here.
      # In this repo it can invoke the runner's global Yarn 1 binary before
      # Corepack has a chance to resolve the pinned Yarn 4 version.
      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

  setup:
    name: Setup Affected Context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare-dependencies

    outputs:
      nx_base: ${{ steps.affected.outputs.nx_base }}
      nx_head: ${{ steps.affected.outputs.nx_head }}
      affected_projects: ${{ steps.projects.outputs.affected_projects }}
      # Which heavy `Test` suites this run pays for (ADR 0140). `run_all` is
      # set for a push, a manual run, and any resolver failure, so every
      # condition below is `run_all or my own flag` and the fallback is always
      # to run more. The flag names come from
      # `flagName` in tools/scripts/lib/gate-triggers.ts over the suite ids in
      # tools/config/gate-triggers.json — add a suite there, not here.
      gate_run_all: ${{ steps.gate-triggers.outputs.run_all }}
      gate_tools_test: ${{ steps.gate-triggers.outputs.run_tools_test }}
      gate_upstream_briefs_test: ${{ steps.gate-triggers.outputs.run_upstream_briefs_test }}
      gate_openapi_check: ${{ steps.gate-triggers.outputs.run_openapi_check }}
      gate_prisma_migration_drift: ${{ steps.gate-triggers.outputs.run_prisma_migration_drift }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Compute affected range
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ -z "$BASE" || "$BASE" == '0000000000000000000000000000000000000000' ]]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          fi

          echo "nx_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "nx_head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Using NX_BASE=$BASE"
          echo "Using NX_HEAD=$HEAD"

      - name: Compute affected projects
        id: projects
        shell: bash
        run: |
          set -euo pipefail

          BASE='${{ steps.affected.outputs.nx_base }}'
          HEAD='${{ steps.affected.outputs.nx_head }}'

          if ! AFFECTED_JSON="$(corepack yarn nx show projects --affected --base="$BASE" --head="$HEAD" --json | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); process.stdout.write(JSON.stringify(JSON.parse(input))); ")"; then
            echo 'Error: Failed to compute affected projects JSON from Nx output.' >&2
            exit 1
          fi

          echo "affected_projects=$AFFECTED_JSON" >> "$GITHUB_OUTPUT"
          echo "Affected projects: $AFFECTED_JSON"

      # A pull request pays for a heavy suite only when its own trigger globs
      # match a changed path; a push to `main` or a manual run pays for all of
      # them, so `main` keeps its whole-tree guarantee before a release is cut
      # (ADR 0140). The globs live in tools/config/gate-triggers.json and the
      # Gate Trigger resolver is our own code rather than a marketplace
      # path-filter action,
      # because `covering-gates:check` asserts the same globs against the
      # review-obligation catalogue (ADR 0074).
      #
      # The resolver answers a failure it can describe with every flag set and
      # exit 0. The one it cannot — a config it cannot parse, so it does not
      # know the flag names — exits non-zero, and `run_all=true` here is the
      # same fallback by another route. Never skip on error.
      #
      # Exit 0 alone is not enough to trust the output: a resolver that exits
      # 0 having printed nothing would write no flags, leaving every `if:`
      # below false and skipping every heavy suite silently — fewer suites on
      # an error, which is the one thing ADR 0140 item 3 forbids. So the
      # output has to carry a `run_all=` line to count as a resolution.
      - name: Resolve heavy gate triggers
        id: gate-triggers
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.affected.outputs.nx_base }}
          HEAD_SHA: ${{ steps.affected.outputs.nx_head }}
        run: |
          set -uo pipefail

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            set -- "$BASE_SHA" "$HEAD_SHA"
          else
            set -- --all
          fi

          flags="$(node tools/scripts/ci/resolve-gate-triggers.ts "$@")" || flags=''

          if ! printf '%s\n' "$flags" | grep -q '^run_all='; then
            echo '::warning title=Gate trigger resolution failed::Running every heavy suite.'
            echo 'run_all=true' >> "$GITHUB_OUTPUT"
            echo 'Gate trigger resolution failed; running every heavy suite.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s\n' "$flags" >> "$GITHUB_OUTPUT"
          {
            echo '## Heavy gate suites'
            echo
            printf '%s\n' "$flags" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      # Whole tree. Without --all, nx format:check diffs against main, which
      # this checkout does not have. A skipped Husky hook never rewrites, so
      # this step is what fails the Lint check (issue #791).
      - name: Check formatting
        run: corepack yarn format:check --all

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-lint-
            ${{ runner.os }}-nx-22-

      # A pull request lints what it can have broken; a push lints the whole
      # tree. The whole-tree run is not only `main`'s guarantee before a
      # release — it is also the only thing that writes a *complete* Nx cache
      # baseline for a pull request to restore from. An affected-only push
      # caches only what that push happened to touch, which is why the
      # computation cache barely helped before this (issue #1382).
      - name: Lint affected projects
        if: github.event_name == 'pull_request'
        run: corepack yarn nx affected -t lint --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }}

      - name: Lint every project
        if: github.event_name != 'pull_request'
        run: corepack yarn nx run-many -t lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: setup

    env:
      # Prisma generate reads this without connecting, to satisfy Prisma v7
      # config loading. Nothing else in this job touches a database: the
      # drift check that needs a live Postgres is its own path-gated
      # `Prisma Migration Gate` job below, so this job carries no service
      # container (ADR 0094, ADR 0140, issue #1394).
      DATABASE_URL: postgresql://localhost:5432/myorganiser

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Setup Java 21
        # openapi:check regenerates the client via openapi-generator-cli, which is
        # a Java tool. Pinned explicitly rather than relying on the runner image's
        # preinstalled JDK, which is not part of the runner's stability contract.
        # Nothing else in this job needs a JDK, so it is set up exactly when
        # openapi:check runs (ADR 0140).
        if: needs.setup.outputs.gate_run_all == 'true' || needs.setup.outputs.gate_openapi_check == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      # One glob target for every Contract Suite under tools/scripts (ADR
      # 0135), in place of the per-suite steps this job used to carry one at
      # a time — the Sandcastle decision contracts included, which are
      # tools/scripts/lib/sandcastle-*.test.ts like any other suite here.
      # This glob is the only thing that wires a suite (the gate-coverage
      # meta-gate below); run one in isolation with `node --test <file>`.
      # upstream:briefs:test still runs on its own further
      # down: it also runs suites under .agents/skills/upstream-brief, which
      # this glob does not reach.
      #
      # Path-gated on a pull request (ADR 0140): a suite proves its checker
      # works, and the checkers themselves still run over the whole tree
      # through the steps below. `tools:test` stays spelled exactly here, so
      # the Meta-Gate still reads this job as the glob runner's wiring.
      - name: Run tools/scripts contract suites
        if: needs.setup.outputs.gate_run_all == 'true' || needs.setup.outputs.gate_tools_test == 'true'
        run: corepack yarn tools:test

      - name: Check OpenAPI spec and generated client are in sync
        # Regenerates the spec and client, then asserts a clean tree. Runs before
        # the hygiene steps so an unrelated step cannot dirty the tree first.
        # The Covering Gate for the generated API surface, so its triggers are
        # asserted against the review-obligation catalogue by
        # `yarn covering-gates:check` (ADR 0074, ADR 0140).
        if: needs.setup.outputs.gate_run_all == 'true' || needs.setup.outputs.gate_openapi_check == 'true'
        run: corepack yarn openapi:check

      - name: Check design token outputs are in sync
        # Same shape as openapi:check and for the same reason: src/generated is
        # derived from tokens.json, and nothing asserted the two agreed until
        # ADR 0098 needed a Covering Gate for the tokens trigger. Runs next to
        # openapi:check so both regenerate before anything else can dirty the tree.
        run: corepack yarn design-tokens:check

      - name: Check component hygiene
        run: corepack yarn component:hygiene --all --max-warnings=0

      - name: Check Jest test hygiene
        run: corepack yarn test:hygiene --all

      - name: Check House Explainer Page hygiene
        # --all also fails on a page under docs/ that is in neither ROSTER nor
        # LEGACY, which is the half Husky cannot see: a new page is unstaged
        # against the roster exactly once, here.
        run: corepack yarn design:hygiene --all

      # Every cheap, file-reading Assertion Gate checker in `tools/scripts/lib/gate-manifest.ts`
      # (ADR 0043) — the roster this job used to run as ~33 separate named
      # steps, one `corepack yarn` line apiece. Each `corepack yarn` invocation
      # costs roughly 1.3s of process overhead, so that roster cost over a
      # minute to do a few seconds of real checking. One step keeps every
      # failure readable: `yarn gates:run` wraps each gate's output in its own
      # collapsible `::group::` and raises a named `::error` annotation for
      # each one that fails, so a failure is still identifiable without
      # opening a log. A checker's own "why" lives in its header comment, not
      # here. The three hygiene checks above and `libs:markdown:check` /
      # `docs:notes:check` below stay their own steps rather than joining this
      # manifest: Husky's `gates:run` line (`.husky/pre-commit`) already runs
      # the whole manifest unconditionally on every local commit, and these
      # five either need a `--staged`-vs-`--all` distinction the manifest has
      # no way to express, or (for the two zero-arg checks) would simply run
      # twice — either way, changing what gets folded in here must not change
      # what Husky runs (issue #1389's "pre-commit behaviour is unchanged").
      - name: Run cheap Assertion Gates
        run: corepack yarn gates:run

      # Project names, roots, and targets. `backend:generate-types` only writes
      # the Prisma client, and no Nx plugin infers a project or target from
      # that output, so this file stays valid for the checkers after generate.
      # Review Tier is a separate workflow and its only graph consumer, so it
      # still builds its own. Each checker used to spawn `nx graph` itself;
      # that build is the slow part (ADR 0043 records the lint checker at 19s).
      # One graph for the three checkers in this job that read it (issue #1061).
      # A missing or mistyped path fails the checker; it does not rebuild.
      # The path goes through GITHUB_ENV because job-level `env` cannot read the
      # `runner` context: `${{ runner.temp }}` there rejects the whole workflow.
      - name: Build the Nx project graph
        run: |
          echo "NX_GRAPH_FILE=$RUNNER_TEMP/nx-graph.json" >> "$GITHUB_ENV"
          corepack yarn nx graph --file "$RUNNER_TEMP/nx-graph.json"

      # Asserts every project Nx can lint is reachable as `lint`, the target the
      # lint job selects. Five projects were outside it until #426.
      - name: Check lint gate coverage
        run: corepack yarn lint:coverage:check "$NX_GRAPH_FILE"

      # apps/backend/src/prisma is generated and gitignored, so a fresh runner
      # has no @prisma/client to compile against. backend:test declares this
      # same dependency; typechecking needs it just as much, and runs first.
      - name: Generate Prisma client
        run: corepack yarn nx run backend:generate-types

      # Compiles each project's production and spec programs. Nothing ran
      # TypeScript in CI before this, so two type errors had reached main.
      # The graph was built above; this step needs the generated Prisma client,
      # not a second graph.
      - name: Typecheck all projects
        run: corepack yarn typecheck:check "$NX_GRAPH_FILE"

      - name: Check libs markdown allowlist
        run: corepack yarn libs:markdown:check

      - name: Check docs notes routing
        run: corepack yarn docs:notes:check

      # A fix names the change that introduced its defect, or declares that
      # nothing can be named (ADR 0100) — the line the escaped-defect rate is
      # built from. Pull requests only: a push has no head branch to type.
      # Branch and title reach the script through env and are never
      # interpolated into the shell, because both are author-controlled text.
      - name: Check a fix names its origin
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: corepack yarn fix:attribution:check --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --title "$PR_TITLE"

      # Asserts every `nx run <project>:<target>` and `nx <target> <project>` in
      # tracked Markdown resolves in the project graph. DEVELOPMENT.md taught two
      # targets that never existed until #980. Reads the graph built once above,
      # so CI only — Husky does not run it.
      - name: Check documented Nx targets resolve
        run: corepack yarn docs:nx-targets:check "$NX_GRAPH_FILE"

      # These suites ship beside the upstream-brief Skill rather than under
      # tools/scripts, so `tools:test`'s glob does not reach them — which is
      # also why they are their own path-gated suite (ADR 0140).
      - name: Upstream Brief report contract and checker contracts
        if: needs.setup.outputs.gate_run_all == 'true' || needs.setup.outputs.gate_upstream_briefs_test == 'true'
        run: corepack yarn upstream:briefs:test

      # ADR 0064: the Escape Copy must be openable by a tool that needs nothing
      # of ours, and a gate must assert the tool still opens a freshly produced
      # envelope. This builds the reader and runs it against an envelope the
      # real exporter produces here, so a schema move that outruns the reader
      # fails now rather than on the day somebody needs it. CI-only: it builds
      # a 500 KB page and runs PBKDF2 four times, which is more than the
      # pre-commit aggregate is for.
      - name: Check the Escape Copy reader opens a fresh envelope
        run: corepack yarn escape-copy-reader:check

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-test-
            ${{ runner.os }}-nx-22-

      # Affected on a pull request, whole tree on a push — the same split as
      # Lint above, and for the same two reasons: `main`'s guarantee, and a
      # full Nx cache baseline for pull requests to restore from.
      - name: Test affected projects
        if: github.event_name == 'pull_request'
        run: corepack yarn nx affected -t test --base=${{ needs.setup.outputs.nx_base }} --head=${{ needs.setup.outputs.nx_head }}

      - name: Test every project
        if: github.event_name != 'pull_request'
        run: corepack yarn nx run-many -t test

  # Tier 2 of the Prisma migration gate (ADR 0094): applies the migration
  # history to an ephemeral Postgres and asserts applying it reproduces the
  # schema. Split out of `Test` into its own job so a pull request that
  # cannot have touched a migration never pays for the ~23s Postgres
  # container start (ADR 0140, issue #1394) — the condition below is what
  # keeps the service from even starting on a run that skips it. `main`
  # always runs it, through the same `gate_run_all` fallback every other
  # heavy suite in tools/config/gate-triggers.json uses.
  prisma-migration-gate:
    name: Prisma Migration Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ needs.setup.outputs.gate_run_all == 'true' || needs.setup.outputs.gate_prisma_migration_drift == 'true' }}
    needs: setup

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway runner service. Trust avoids storing a credential in the
          # workflow; this database is never reachable off the job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: myorganiser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # migrate deploy and migrate diff use the service above, so a migration
      # that fails to apply, or a schema that has drifted from the
      # migrations, fails before merge.
      DATABASE_URL: postgresql://postgres@localhost:5432/myorganiser

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      # This job has its own checkout, so it needs its own generated client —
      # the same dependency the Test job's Typecheck step has, generated
      # there for that job rather than shared across jobs.
      - name: Generate Prisma client
        run: corepack yarn nx run backend:generate-types

      - name: Apply Prisma migrations and check schema drift
        run: corepack yarn prisma:migration:drift

      # The one backend *.int.test.ts that does not mock ../prisma: it replays
      # a landed migration's real SQL inside a rolled-back transaction, so it
      # needs the schema the deploy above just applied. `Test` carries no
      # database (ADR 0094, ADR 0140, issue #1394), so this file is excluded
      # from its jest run (apps/backend/jest.config.ts) and run here instead,
      # with the config's own ignore list overridden back to its default so
      # this one file is no longer skipped.
      - name: Run Prisma migration backfill test
        run: |
          node node_modules/.bin/jest --config=apps/backend/jest.config.ts \
            --testPathIgnorePatterns='/node_modules/' \
            --testPathPatterns='backfillUserCreatedAt\.int\.test\.ts$' \
            --no-coverage --forceExit

  e2e:
    name: E2E Chromium (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pull requests only: the same commits ran this seconds earlier on the PR,
    # and the nightly workflow covers `main`. See ADR 0050.
    if: ${{ github.event_name == 'pull_request' && contains(fromJson(needs.setup.outputs.affected_projects), 'web-e2e') }}
    # Deliberately NOT gated on `test`, unlike build-backend/build-frontend.
    # Waiting for the unit tests serialised E2E behind them and put the critical
    # path at 11 minutes; running alongside them brings it back to ~8. The cost
    # is that E2E still burns a runner when the unit tests are already failing,
    # which is free on a public repository. See ADR 0050.
    needs:
      - setup
      - lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      # Playwright's webServer starts Nx as a nested child process, and the Nx
      # daemon does not survive that cleanly on hosted runners.
      NX_DAEMON: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-e2e-
            ${{ runner.os }}-nx-22-

      # Only the browser this lane needs. Playwright advises against caching
      # browser binaries: restoring the cache costs about what downloading does.
      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      # Built here rather than inside Playwright's webServer timeout, so a build
      # failure is attributable and starting the server is only that.
      - name: Build frontend for E2E
        run: corepack yarn nx build web

      - name: Run E2E shard
        run: corepack yarn nx run web-e2e:e2e --shard=${{ matrix.shard }}/3 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e-report:
    name: E2E Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs:
      - e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: e2e-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into a single HTML report
        run: corepack yarn playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-html-report
          path: playwright-report/
          retention-days: 7

  build-backend:
    name: Build Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'backend') }}
    needs:
      - setup
      - lint
      - test

    env:
      # Required for Prisma v7 config loading during `prisma generate`.
      # CI uses a dummy local URL here because generation does not connect.
      DATABASE_URL: postgresql://localhost:5432/myorganiser

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build backend
        run: corepack yarn nx build backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'web') }}
    needs:
      - setup
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build frontend
        run: corepack yarn nx build web

  # Not a shard of the hermetic lane (ADR 0050). That lane stubs /auth/logout.
  # Starting the real API beside those stubs makes unmocked calls hit it and
  # the shard times out. This job runs only the live logout spec.
  e2e-live-logout:
    name: E2E live logout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'pull_request' && contains(fromJson(needs.setup.outputs.affected_projects), 'web-e2e') }}
    needs:
      - setup
      - lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: myorganiser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NX_DAEMON: 'false'
      E2E_LIVE_BACKEND: '1'
      DATABASE_URL: postgresql://postgres@localhost:5432/myorganiser
      ACCESS_JWT_SECRET: e2e-access-jwt
      REFRESH_JWT_SECRET: e2e-refresh-jwt
      VERIFY_JWT_SECRET: e2e-verify-jwt

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-22-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-22-e2e-
            ${{ runner.os }}-nx-22-

      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      - name: Build frontend for E2E
        run: corepack yarn nx build web

      - name: Build backend for live logout
        run: corepack yarn nx build backend

      - name: Run live logout spec
        run: corepack yarn nx e2e web-e2e --grep="logs out against the real backend"

      # User Deletion (#969) against the real API: its own seeded user, so the
      # logout spec above is unaffected.
      - name: Run live account deletion spec
        run: corepack yarn nx e2e web-e2e --grep="deletes the account against the real backend"

  # The mobile app's react-native-web target. Nothing else builds it, so a
  # native-only import in shared mobile source broke it unnoticed (#1048).
  # Appended last so the line citations in release-pipeline.html stay valid.
  build-mobile:
    name: Build Mobile (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ contains(fromJson(needs.setup.outputs.affected_projects), 'mobile') }}
    needs:
      - setup
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build mobile web target
        run: corepack yarn nx build mobile

  # Chromatic's publish job was the only CI step that built Storybook (ADR 0139).
  # This keeps that build as a check: a story that fails to compile fails here.
  # Unconditional, as the publish job was: stories live in several libraries,
  # so no single affected project stands for all of them.
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare-dependencies

    env:
      STORYBOOK_BUILD_TIMEOUT: '900000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-node-22-deps-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'apps/**/package.json', 'libs/**/package.json') }}

      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: corepack yarn install --immutable

      - name: Verify frozen lockfile
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- yarn.lock

      - name: Build Storybook
        run: corepack yarn build-storybook
